name: Lint Charts

on:
  push:
    branches:
      - main
  pull_request:
  workflow_call:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Helm
        uses: azure/setup-helm@v4

      # Chart edits need not bump a version, so lint every chart rather than
      # relying on the release trigger.
      - name: Lint charts
        run: |
          set -euo pipefail
          for chart in */Chart.yaml; do
            echo "::group::helm lint $(dirname "$chart")"
            helm lint "$(dirname "$chart")"
            echo "::endgroup::"
          done
