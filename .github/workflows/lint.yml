name: Lint Charts

on:
  push:
    branches:
      - main
  pull_request:
  workflow_call:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # The bump guard diffs against the pushed range and reads release tags.
          fetch-depth: 0

      - name: Set up Helm
        uses: azure/setup-helm@v4

      - name: Lint charts
        run: |
          set -euo pipefail
          for chart in */Chart.yaml; do
            echo "::group::helm lint $(dirname "$chart")"
            helm lint "$(dirname "$chart")"
            echo "::endgroup::"
          done

      # chart-releaser publishes a chart only when its version is untagged, so a
      # changed chart with an unchanged version would never ship. Fail instead.
      - name: Require a version bump for changed charts
        if: github.event_name == 'push' && github.event.before != '0000000000000000000000000000000000000000'
        env:
          BEFORE: ${{ github.event.before }}
          HEAD_SHA: ${{ github.event.head_commit.id }}
        run: |
          set -euo pipefail
          if ! git rev-parse -q --verify "$BEFORE^{commit}" >/dev/null; then
            echo "::warning::cannot resolve $BEFORE; skipping the version-bump guard."
            exit 0
          fi
          failed=0
          for chart in */Chart.yaml; do
            dir="$(dirname "$chart")"
            if git diff --quiet "$BEFORE" "$HEAD_SHA" -- "$dir"; then
              continue
            fi
            version="$(awk '/^version:/ {print $2; exit}' "$chart")"
            if git rev-parse -q --verify "refs/tags/$dir-$version" >/dev/null; then
              echo "::error file=$chart::$dir changed but $dir-$version is already released; bump version in $chart"
              failed=1
            else
              echo "$dir@$version is unreleased; Release Charts will publish it."
            fi
          done
          exit "$failed"
