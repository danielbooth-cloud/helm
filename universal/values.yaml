# Default values for universal.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

# Set to "deployment", "deployment-ns", "statefulset", "rabbitmqcluster" or "cronjob" as required
applicationType: deployment

# This will set the replicaset count more information can be found here: https://kubernetes.io/docs/concepts/workloads/controllers/replicaset/
replicaCount: 1

# This sets the container image more information can be found here: https://kubernetes.io/docs/concepts/containers/images/
image:
  repository: bash
  # This sets the pull policy for images.
  pullPolicy: IfNotPresent
  # Overrides the image tag whose default is the chart appVersion.
  tag: latest
  # The command to run in the container
  command: []
  # The args to pass to the command
  args: []

# This is for the secretes for pulling an image from a private repository more information can be found here: https://kubernetes.io/docs/tasks/configure-pod-container/pull-image-private-registry/
imagePullSecrets: []
# This is to override the chart name.
nameOverride: ""
fullnameOverride: ""

reloader:
  enabled: false

configMountPath: ""

config: []
  # config.yml : |-
  #   mock config

certificates: []

setupScripts: []
  # setup.sh: |
  #   #!/bin/bash
  #   # This script is executed every time the pod is started.

# initContainers.args list of arguments to execute on the initcontainer to
# setup the pod for running the data-processor for the first time
initContainers: {}
  # image:
  #   repository: bash
  #   tag: latest
  # args:
  #   - -c
  #   - bash /scripts/setup.sh

ports: []
#  - containerPort: 9782
#    name: metrics
#    protocol: TCP

persistence:
  data:
    # If create is true then the proceding values are used if
    # false then only claimName is required
    annotations: {}
    create: false
    # useVolumeClaimTemplate: when true (statefulset only), creates per-replica PVCs via volumeClaimTemplates.
    # When false, creates a standalone shared PVC (useful for ReadWriteMany access mode).
    useVolumeClaimTemplate: true
    accessMode: "ReadWriteOnce"
    enabled: false
    size: 10Gi
    storageClass: default
    mountPath: /data/

    # Only required if create = false
    claimName:
  logs:
    # If create is true then the proceding values are used if
    # false then only claimName is required
    annotations: {}
    create: false
    accessMode: ReadWriteOnce
    enabled: false
    size: 10Gi
    storageClass: default
    mountPath: /logs/

    # Only required if create = false
    claimName:

extraVolumeMounts: []
  # - name: customConfig
  #   mountPath: /mnt/config
  #   readOnly: true
  # - name: additionalSecret:
  #   mountPath: /mnt/secret

extraVolumes: []
  # - name: customConfig
  #   configMap:
  #     name: custom-config
  #     items:
  #       - key: config.yaml

# This section builds out the service account more information can be found here: https://kubernetes.io/docs/concepts/security/service-accounts/
serviceAccount:
  # Specifies whether a service account should be created
  create: false
  # Automatically mount a ServiceAccount's API credentials?
  automount: true
  # Annotations to add to the service account
  annotations: {}
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name: ""

# This is for setting Kubernetes Annotations to a Pod.
# For more information checkout: https://kubernetes.io/docs/concepts/overview/working-with-objects/annotations/
podAnnotations: {}
# This is for setting Kubernetes Labels to a Pod.
# For more information checkout: https://kubernetes.io/docs/concepts/overview/working-with-objects/labels/
podLabels: {}

podSecurityContext: {}
  # fsGroup: 2000

# containerSecurityContext can be used to set the security context for the
containerSecurityContext: {}
  # allowPrivilegeEscalation: false
  # readOnlyRootFilesystem: false

# securityContext can be used to set the security context for the container
securityContext: {}
  # runAsUser: 1000
  # runAsGroup: 3000
  # fsGroup: 2000

# This is for setting up a service more information can be found here: https://kubernetes.io/docs/concepts/services-networking/service/
service:
  # This sets the service type more information can be found here: https://kubernetes.io/docs/concepts/services-networking/service/#publishing-services-service-types
  type: ClusterIP
  # This sets the ports more information can be found here: https://kubernetes.io/docs/concepts/services-networking/service/#field-spec-ports
  ports: {}
  annotations: []
  loadBalancerIP: ""
  loadBalancerSourceRanges: []

# This block is for setting up the ingress for more information can be found here: https://kubernetes.io/docs/concepts/services-networking/ingress/
ingress:
  enabled: false
  className: ""
  annotations: {}
    # kubernetes.io/ingress.class: nginx
    # kubernetes.io/tls-acme: "true"
  hosts:
    - host: chart-example.local
      paths:
        - path: /
          pathType: ImplementationSpecific
  tls: []
  #  - secretName: chart-example-tls
  #    hosts:
  #      - chart-example.local

resources: {}
  # We usually recommend not to specify default resources and to leave this as a conscious
  # choice for the user. This also increases chances charts run on environments with little
  # resources, such as Minikube. If you do want to specify resources, uncomment the following
  # lines, adjust them as necessary, and remove the curly braces after 'resources:'.
  # limits:
  #   cpu: 100m
  #   memory: 128Mi
  # requests:
  #   cpu: 100m
  #   memory: 128Mi

secretVolumes: {}
# - name: certificates
#   secretName: consumor-api-certs
#   mountPath: /etc/superconductor/certs
#   items:
#     - key: server.crt
#       path: server.crt
#     - key: server.key
#       path: server.key

envs: []
# Example
# - name: FOO
#   value: BAR

envFrom: []
#   Example
#    - secret_name: credentials - The name of the secret
#      variable_name: AWS_ACCESS_KEY_ID - The name of the env variable
#      key: AWS_ACCESS_KEY_ID - The name of the object in the secret
#      type: secretKeyRef

# This is to setup the liveness and readiness probes more information can be found here: https://kubernetes.io/docs/tasks/configure-pod-container/configure-liveness-readiness-startup-probes/
livenessProbe: {}
readinessProbe: {}

# This section is for setting up autoscaling more information can be found here: https://kubernetes.io/docs/concepts/workloads/autoscaling/
autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 100
  targetCPUUtilizationPercentage: 80
  # targetMemoryUtilizationPercentage: 80

podDisruptionBudget:
  enabled: false
  minAvailable: 2
  # maxUnavailable: 2

nodeSelector: {}

tolerations: []

affinity: {}

runtimeClassName: {}

topologySpreadConstraints: []
  # - maxSkew: 1
  #   topologyKey: kubernetes.io/hostname
  #   whenUnsatisfiable: ScheduleAnyway
  #   labelSelector:
  #     matchLabels:
  #       app.kubernetes.io/name: superconductor

cronjob:
  schedule: "1 0 1 * *"
  annotations: {}
  successful_job_limit: 3
  failed_job_limit: 3
  concurrencyPolicy: Forbid
  backoffLimit: 0

