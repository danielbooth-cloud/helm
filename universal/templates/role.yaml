{{- if .Values.role.create }}
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ .Values.role.name | default (printf "%s-sa" (include "universal.name" .)) }}
  namespace: {{ $.Release.Namespace }}
  labels:
    {{- include "universal.labels" . | nindent 4 }}
  {{- with .Values.role.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
rules:
  {{- with .Values.role.rules }}
    {{- toYaml . | nindent 2 }}
  {{- end }}
{{- end }}
