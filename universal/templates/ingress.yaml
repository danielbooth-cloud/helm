{{- if .Values.ingress.enabled -}}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "universal.fullname" . }}
  labels:
    {{- include "universal.labels" . | nindent 4 }}
  {{- with .Values.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- with .Values.ingress.className }}
  ingressClassName: {{ . }}
  {{- end }}
  {{- if .Values.ingress.tls }}
  tls:
    {{- range .Values.ingress.tls }}
    - hosts:
        {{- range .hosts }}
        - {{ . | quote }}
        {{- end }}
      secretName: {{ .secretName }}
    {{- end }}
  {{- end }}
  rules:
    {{- range .Values.ingress.hosts }}
    - host: {{ .host | quote }}
      http:
        paths:
          {{- range .paths }}
          - path: {{ .path }}
            {{- with .pathType }}
            pathType: {{ . }}
            {{- end }}
            {{- /* Backend port: the path's servicePort, else service.port, else the first service.ports name. Strings are port names. */}}
            {{- $port := .servicePort | default $.Values.service.port }}
            {{- if and (not $port) $.Values.service.ports }}
            {{- $port = keys $.Values.service.ports | sortAlpha | first }}
            {{- end }}
            backend:
              service:
                name: {{ include "universal.fullname" $ }}
                port:
                  {{- if and (kindIs "string" $port) (not (regexMatch "^[0-9]+$" $port)) }}
                  name: {{ $port }}
                  {{- else }}
                  number: {{ $port }}
                  {{- end }}
          {{- end }}
    {{- end }}
{{- end }}
