{{ if eq .Values.applicationType "cronjob" -}}
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ include "universal.name" . }}
  namespace: {{ .Release.Namespace }}
  {{- if .Values.cronjob.annotations }}
  annotations: {{- toYaml .Values.cronjob.annotations | indent 4 }}
  {{- end }}
  labels: {{- include "universal.labels" . | nindent 4 }}
spec:
  schedule: "{{ .Values.cronjob.schedule }}"
  successfulJobsHistoryLimit: {{ .Values.cronjob.successful_job_limit }}
  failedJobsHistoryLimit: {{ .Values.cronjob.failed_job_limit }}
  concurrencyPolicy: {{ .Values.cronjob.concurrencyPolicy }}
  jobTemplate:
    spec:
      template:
        metadata:
          {{- with .Values.podAnnotations }}
          annotations:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          labels:
            {{- include "universal.labels" . | nindent 12 }}
            {{- with .Values.podLabels }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
        spec:
          {{- if .Values.imagePullSecrets }}
          imagePullSecrets: {{- toYaml .Values.imagePullSecrets | nindent 12 }}
          {{- end }}
          serviceAccountName: {{ include "universal.serviceAccountName" . }}
          serviceAccount: {{ include "universal.serviceAccountName" . }}
          restartPolicy: OnFailure
          {{- if .Values.runtimeClassName }}
          runtimeClassName: {{ .Values.runtimeClassName }}
          {{- end }}
          {{- if .Values.initContainers }}
          initContainers:
            - image: "{{ .Values.initContainers.image.repository }}:{{ .Values.initContainers.image.tag }}"
              imagePullPolicy: {{ .Values.image.pullPolicy }}
              name: "{{ include "universal.name" . }}-init"
              {{- if .Values.initContainers }}
              args:
              {{- range .Values.initContainers.args }}
                - {{ . }}
              {{- end }}
              {{- end }}
              {{- if .Values.persistence }}
              volumeMounts:
                - name: {{ include "universal.name" . }}-setup-scripts
                  mountPath: /scripts
              {{- if .Values.persistence.data.enabled }}
                - name: {{ include "universal.name" . }}-data
                  mountPath: {{ .Values.persistence.data.mountPath }}
              {{- end }}
            {{- if .Values.persistence.logs.enabled }}
                - name: {{ include "universal.name" . }}-logs
                  mountPath: {{ .Values.persistence.logs.mountPath }}
              {{- end }}
              {{- end }}
          {{- end }}
          containers:
          - name: {{ include "universal.name" . }}
            securityContext:
              {{- toYaml .Values.containerSecurityContext | nindent 14 }}
            image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default "latest" }}"
            imagePullPolicy: {{ .Values.image.pullPolicy }}
            args:
              {{- range .Values.image.args }}
                - {{ . }}
              {{- end }}
            resources:
              {{- toYaml .Values.resources | nindent 14 }}
            volumeMounts:
            {{- if .Values.config }}
              - name: {{ include "universal.name" . }}-config
                mountPath: {{ .Values.configMountPath }}
            {{- end }}
            {{- if .Values.persistence.data.enabled }}
              - name: {{ include "universal.name" . }}-data
                mountPath: {{ .Values.persistence.data.mountPath }}
            {{- end }}
            {{- if .Values.persistence.logs.enabled }}
              - name: {{ include "universal.name" . }}-logs
                mountPath:  {{ .Values.persistence.logs.mountPath }}
                {{- if .Values.persistence.logs.subPath }}
                subPath: {{ .Values.persistence.logs.subPath | default (include "universal.name" .) }}
                {{- end }}
            {{- end }}
            {{- if .Values.secretVolumes }}
            {{- range $key, $value := .Values.secretVolumes }}
              - name: {{ $value.name }}
                mountPath: {{ $value.mountPath }}
            {{- end }}
            {{- end }}
            {{- with .Values.extraVolumeMounts }}
              {{- toYaml . | nindent 12 }}
            {{- end }}
            {{- with .Values.envs }}
            env:
              {{- toYaml . | nindent 12 }}
            {{- end }}
            {{- with .Values.envFrom }}
            envFrom:
              {{- toYaml . | nindent 12 }}
            {{- end }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          volumes:
          {{- if .Values.config }}
          - name: {{ include "universal.name" . }}-config
            configMap:
              name: "{{ include "universal.fullname" . }}-config"
          {{- end }}
          {{- if .Values.setupScripts }}
          - name: {{ include "universal.name" . }}-setup-scripts
            configMap:
              name: {{ include "universal.name" . }}-setup-scripts
              defaultMode: 0777
          {{- end }}
          {{- if .Values.persistence.data.enabled }}
          - name: {{ include "universal.name" . }}-data
            persistentVolumeClaim:
              {{- if not .Values.persistence.data.create }}
              claimName: {{ .Values.persistence.data.claimName }}
              {{- else }}
              claimName: "{{ include "universal.name" . }}-data-pvc"
              {{- end }}
          {{- end }}
          {{- if .Values.persistence.logs.enabled }}
          - name: {{ include "universal.name" . }}-logs
            persistentVolumeClaim:
              {{- if not .Values.persistence.logs.create }}
              claimName: {{ .Values.persistence.logs.claimName }}
              {{- else }}
              claimName: "{{ include "universal.name" . }}-logs-pvc"
              {{- end }}
          {{- end }}
          {{- if .Values.secretVolumes }}
          {{- range $key, $value := .Values.secretVolumes }}
          - name: {{ $value.name }}
            secret:
              secretName: {{ $value.secretName }}
          {{- if $value.items }}
              items:
            {{- range $key, $item := $value.items }}
              - key: {{ $item.key }}
                path: {{ $item.path }}
            {{- end }}
          {{- end }}
          {{- end }}
          {{- end }}
          {{- with .Values.extraVolumes }}
          {{- toYaml . | nindent 10 }}
          {{- end }}
{{- end }}