apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "universal.fullname" . }}-config
  namespace: {{ .Release.Namespace }}
  labels: {{- include "universal.labels" . | nindent 4 }}
  {{- if .Values.reloader.enabled }}
  annotations:    
    configmap.reloader.stakater.com/reload: "{{ include "universal.name" . }}-configmap"
  {{- end }}
data:
{{- range $key, $value := .Values.config }}
  {{ $key }}: |
{{- $value | nindent 4 }}
{{ end }}
{{- range $key, $value := .Values.certificates }}
  {{ $key }}: |
{{- $value | nindent 4 }}
{{- end }}
{{- if .Values.setupScripts }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "universal.fullname" . }}-setup-scripts
  namespace: {{ .Release.Namespace }}
  labels: {{- include "universal.labels" . | nindent 4 }}
  annotations:
    {{- if .Values.reloader.enabled }}
    configmap.reloader.stakater.com/reload: "{{ include "universal.name" . }}-configmap"
    {{- end }}
data:
{{- range $key, $value := .Values.setupScripts }}
  {{ $key }}: |
{{ $value | indent 4 }}
{{- end }}
{{- end }}
