{{- if or (eq .Values.applicationType "deployment") (eq .Values.applicationType "statefulset") }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "universal.fullname" . }}
  labels:
    {{- include "universal.labels" . | nindent 4 }}
  {{- with .Values.service.annotations }}
  annotations:
  {{- tpl (toYaml .) . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.service.type }}
  {{- if eq .Values.applicationType "deployment" }}
  {{- if .Values.service.loadBalancerIP }}
  loadBalancerIP: {{ .Values.service.loadBalancerIP }}
  {{- end }}
  {{- with .Values.service.loadBalancerSourceRanges }}
  loadBalancerSourceRanges:
    {{ toYaml . | indent 4 }}
  {{- end }}
  {{- end }}
  {{- if eq .Values.applicationType "statefulset" }}
  clusterIP: "None"
  {{- end }}
  ports:
  {{- range $key, $value := .Values.service.ports }}
    - name: {{ $key }}
      protocol: {{ $value.protocol }}
      port: {{ $value.port }}
      targetPort: {{ $value.targetPort }}
  {{- end }}
  selector:
    {{- include "universal.selectorLabels" . | nindent 4 }}
{{- end }}
