# postgres-values.yaml
applicationType: statefulset

replicaCount: 3

image:
  repository: ghcr.io/zalando/spilo-17
  pullPolicy: IfNotPresent
  tag: "4.0-p3"

fullnameOverride: postgres
enableServiceLinks: false

ports:
  - containerPort: 5432
    name: postgresql
    protocol: TCP
  - containerPort: 8008
    name: patroni
    protocol: TCP

service:
  type: ClusterIP
  ports:
    postgresql:
      protocol: TCP
      port: 5432
      targetPort: 5432
    patroni:
      protocol: TCP
      port: 8008
      targetPort: 8008

envs:
  - name: SCOPE
    value: postgres-cluster
  - name: PGROOT
    value: /home/postgres/pgdata/pgroot
  - name: DCS_ENABLE_KUBERNETES_API
    value: "true"
  - name: KUBERNETES_USE_CONFIGMAPS
    value: "true"
  - name: PATRONI_KUBERNETES_USE_CONFIGMAPS
    value: "true"
  - name: KUBERNETES_SCOPE_LABEL
    value: cluster-name
  - name: KUBERNETES_LABELS
    value: '{"application": "spilo"}'
  - name: PGPASSWORD_SUPERUSER
    value: postgres
  - name: PGPASSWORD_STANDBY
    value: postgres
  - name: PGPASSWORD_ADMIN
    value: postgres
  - name: PGUSER_SUPERUSER
    value: postgres
  - name: PGUSER_STANDBY
    value: standby
  - name: PGUSER_ADMIN
    value: admin
  - name: POD_IP
    valueFrom:
      fieldRef:
        apiVersion: v1
        fieldPath: status.podIP
  - name: POD_NAMESPACE
    valueFrom:
      fieldRef:
        apiVersion: v1
        fieldPath: metadata.namespace

podLabels:
  application: spilo
  cluster-name: postgres-cluster

persistence:
  data:
    enabled: true
    create: true
    useVolumeClaimTemplate: true
    accessMode: ReadWriteOnce
    size: 10Gi
    storageClass: gp2
    mountPath: /home/postgres/pgdata
  logs:
    enabled: false

resources:
  requests:
    cpu: 250m
    memory: 256Mi
  limits:
    cpu: "1"
    memory: 1Gi

livenessProbe:
  httpGet:
    path: /liveness
    port: 8008
  initialDelaySeconds: 30
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 6

readinessProbe:
  httpGet:
    path: /readiness
    port: 8008
  initialDelaySeconds: 5
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 6

podSecurityContext: {}

securityContext: {}

serviceAccount:
  create: true
  automount: true
  name: postgres-sa

role:
  create: true
  rules:
    - apiGroups: [""]
      resources: ["configmaps"]
      verbs: ["create", "get", "list", "patch", "update", "watch", "delete"]
    - apiGroups: [""]
      resources: ["endpoints"]
      verbs: ["create", "get", "list", "patch", "update", "watch", "delete"]
    - apiGroups: [""]
      resources: ["pods"]
      verbs: ["get", "list", "patch", "update", "watch"]

roleBinding:
  create: true
  roleRef:
    apiGroup: rbac.authorization.k8s.io
    kind: Role
    name: universal-sa
  subjects:
    - kind: ServiceAccount
      name: postgres-sa

extraObjects:
  - apiVersion: v1
    kind: ConfigMap
    metadata:
      name: postgres-cluster-config
      labels:
        application: spilo
        cluster-name: postgres-cluster
      annotations:
        meta.helm.sh/release-name: '{{ .Release.Name }}'
        meta.helm.sh/release-namespace: '{{ .Release.Namespace }}'
  - apiVersion: v1
    kind: ConfigMap
    metadata:
      name: postgres-cluster-leader
      labels:
        application: spilo
        cluster-name: postgres-cluster
      annotations:
        meta.helm.sh/release-name: '{{ .Release.Name }}'
        meta.helm.sh/release-namespace: '{{ .Release.Namespace }}'
  - apiVersion: v1
    kind: Service
    metadata:
      name: postgres-master
    spec:
      type: ClusterIP
      ports:
        - name: postgresql
          protocol: TCP
          port: 5432
          targetPort: 5432
      selector:
        application: spilo
        cluster-name: postgres-cluster
        spilo-role: master
