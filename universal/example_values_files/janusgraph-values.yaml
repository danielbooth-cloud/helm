# Default values for universal.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

# Set to "deployment" or "cronjob" as required
applicationType: deployment

# This will set the replicaset count more information can be found here: https://kubernetes.io/docs/concepts/workloads/controllers/replicaset/
replicaCount: 1


# This sets the container image more information can be found here: https://kubernetes.io/docs/concepts/containers/images/
image:
  repository: janusgraph/janusgraph
  # This sets the pull policy for images.
  pullPolicy: IfNotPresent
  # Overrides the image tag whose default is the chart appVersion.
  tag: latest
  # The command to run in the container
  command: []
  # The args to pass to the command
  args: []

# This is for the secretes for pulling an image from a private repository more information can be found here: https://kubernetes.io/docs/tasks/configure-pod-container/pull-image-private-registry/
imagePullSecrets: []
# This is to override the chart name.
nameOverride: ""
fullnameOverride: "janus-custom"

configMountPath: /etc/opt/janusgraph

config:
  janusgraph-server.yaml: |-
    # Copyright 2019 JanusGraph Authors
    #
    # Licensed under the Apache License, Version 2.0 (the "License");
    # you may not use this file except in compliance with the License.
    # You may obtain a copy of the License at
    #
    #      http://www.apache.org/licenses/LICENSE-2.0
    #
    # Unless required by applicable law or agreed to in writing, software
    # distributed under the License is distributed on an "AS IS" BASIS,
    # WITHOUT WARRANTIES OR CONDITIONS OF ANY KIND, either express or implied.
    # See the License for the specific language governing permissions and
    # limitations under the License.

    host: 0.0.0.0
    port: 8182
    evaluationTimeout: 30000
    channelizer: org.apache.tinkerpop.gremlin.server.channel.WebSocketChannelizer
    graphManager: org.janusgraph.graphdb.management.JanusGraphManager
    graphs:
      graph: /etc/opt/janusgraph/janusgraph.properties
    scriptEngines:
      gremlin-groovy:
        plugins:
          org.janusgraph.graphdb.tinkerpop.plugin.JanusGraphGremlinPlugin: {}
          org.apache.tinkerpop.gremlin.server.jsr223.GremlinServerGremlinPlugin: {}
          org.apache.tinkerpop.gremlin.tinkergraph.jsr223.TinkerGraphGremlinPlugin: {}
          org.apache.tinkerpop.gremlin.jsr223.ImportGremlinPlugin:
            classImports:
              - java.lang.Math
            methodImports:
              - java.lang.Math#*
          org.apache.tinkerpop.gremlin.jsr223.ScriptFileGremlinPlugin:
            files:
              - scripts/empty-sample.groovy
    # JanusGraph sets default serializers. You need to uncomment the following lines, if you require any custom serializers.
    #
    # serializers:
    #   - { className: org.apache.tinkerpop.gremlin.util.ser.GraphBinaryMessageSerializerV1, config: { ioRegistries: [org.janusgraph.graphdb.tinkerpop.JanusGraphIoRegistry] }}
    #   - { className: org.apache.tinkerpop.gremlin.util.ser.GraphBinaryMessageSerializerV1, config: { serializeResultToString: true }}
    #   - { className: org.apache.tinkerpop.gremlin.util.ser.GraphSONMessageSerializerV3, config: { ioRegistries: [org.janusgraph.graphdb.tinkerpop.JanusGraphIoRegistry] }}
    #   # Older serialization versions for backwards compatibility:
    #   - { className: org.apache.tinkerpop.gremlin.util.ser.GraphSONMessageSerializerV2, config: { ioRegistries: [org.janusgraph.graphdb.tinkerpop.JanusGraphIoRegistry] }}
    #   - { className: org.apache.tinkerpop.gremlin.util.ser.GraphSONMessageSerializerV1, config: { ioRegistries: [org.janusgraph.graphdb.tinkerpop.JanusGraphIoRegistryV1d0] }}
    #   - { className: org.apache.tinkerpop.gremlin.util.ser.GraphSONUntypedMessageSerializerV1, config: { ioRegistries: [org.janusgraph.graphdb.tinkerpop.JanusGraphIoRegistryV1d0] }}
    processors:
      - className: org.apache.tinkerpop.gremlin.server.op.session.SessionOpProcessor
        config:
          sessionTimeout: 28800000
      - className: org.apache.tinkerpop.gremlin.server.op.traversal.TraversalOpProcessor
        config:
          cacheExpirationTime: 600000
          cacheMaxSize: 1000
    metrics:
      consoleReporter:
        enabled: true
        interval: 180000
      csvReporter:
        enabled: true
        interval: 180000
        fileName: /tmp/gremlin-server-metrics.csv
      jmxReporter:
        enabled: true
      slf4jReporter:
        enabled: true
        interval: 180000
      graphiteReporter:
        enabled: false
        interval: 180000
    maxInitialLineLength: 4096
    maxHeaderSize: 8192
    maxChunkSize: 8192
    maxContentLength: 65536
    maxAccumulationBufferComponents: 1024
    resultIterationBatchSize: 64
    writeBufferLowWaterMark: 32768
    writeBufferHighWaterMark: 65536
    threadPoolWorker: 8
    gremlinPool: 32
  janusgraph.properties: |-
    storage.backend=cql
    storage.hostname=janus2-cassandra
    storage.port=9043
    storage.username=bn_janusgraph
    storage.password=C6VpwfNLU4
    storage.cql.keyspace=bitnami_janusgraph
    cache.db-cache=true
    metrics.enabled=true
    metrics.jmx.enabled=true
    graph.set-vertex-id=true
    graph.allow-custom-vid-types=true
    janusgraph.schema.default=none
    schema.init.strategy=json
    schema.init.json.file=/etc/opt/janusgraph/schema.json
    schema.init.json.indices-activation=reindex_and_enable_non_enabled
    schema.default=none
    gremlin.graph=org.janusgraph.core.JanusGraphFactory
    storage.cql.cluster-name=JanusCluster
    storage.cql.read-consistency-level=QUORUM
    storage.cql.write-consistency-level=QUORUM
    storage.directory=/data
    cache.db-cache-clean-wait=20
    cache.db-cache-time=180000
    cache.db-cache-size=0.5
  schema.json: |-
    {
      "vertexLabels": [
        { "label": "ntid" },
        { "label": "zenithid" },
        { "label": "altid" },
        { "label": "telco" },
        { "label": "brand" }
      ],

      "edgeLabels": [
        { "label": "known_as",            "multiplicity": "MULTI" },
        { "label": "also_known_as",       "multiplicity": "MULTI" },
        { "label": "previously_known_as", "multiplicity": "MULTI" },
        { "label": "subscriber_of",       "multiplicity": "MULTI" },
        { "label": "provides",            "multiplicity": "MULTI" },
        { "label": "partners_with",       "multiplicity": "MULTI" },
        { "label": "child_of",            "multiplicity": "MULTI" }
      ],

      "propertyKeys": [
        { "key": "id",     "className": "java.lang.String", "cardinality": "SINGLE" },
        { "key": "consent_expiry", "className": "java.lang.Integer", "cardinality": "SINGLE" },
        { "key": "name",     "className": "java.lang.String", "cardinality": "SINGLE" }
      ],

      "compositeIndexes": [
        {
          "name": "byNTIDIdProperty",
          "typeClass": "org.apache.tinkerpop.gremlin.structure.Vertex",                             
          "unique": true,                             
          "indexOnly": "brand",                     
          "keys": [
            {
              "propertyKey": "id"
            }
          ]                       
        },{
          "name": "byZenithIdProperty",
          "typeClass": "org.apache.tinkerpop.gremlin.structure.Vertex",                             
          "unique": true,                             
          "indexOnly": "zenithid",                     
          "keys": [
            {
              "propertyKey": "id"
            }
          ]                       
        },{
          "name": "byAltIdProperty",
          "typeClass": "org.apache.tinkerpop.gremlin.structure.Vertex",                             
          "unique": true,                             
          "indexOnly": "altid",                     
          "keys": [
            {
              "propertyKey": "id"
            }
          ]                       
        },{
          "name": "byTelcoIdProperty",
          "typeClass": "org.apache.tinkerpop.gremlin.structure.Vertex",                             
          "unique": true,                             
          "indexOnly": "telco",                     
          "keys": [
            {
              "propertyKey": "id"
            }
          ]                       
        },{
          "name": "byBrandIdProperty",
          "typeClass": "org.apache.tinkerpop.gremlin.structure.Vertex",                             
          "unique": true,                             
          "indexOnly": "brand",                     
          "keys": [
            {
              "propertyKey": "id"
            }
          ]                       
        }
      ],
      "vertexCentricEdgeIndexes": [],
      "vertexCentricPropertyIndexes": [],
      "mixedIndexes": []
    }

certificates: []

setupScripts: []
  # setup.sh: |
  #   #!/bin/bash
  #   # This script is executed every time the pod is started.

# initContainers.args list of arguments to execute on the initcontainer to
# setup the pod for running the data-processor for the first time
initContainers: {}
  # image:
  #   repository: bash
  #   tag: latest
  # args:
  #   - -c
  #   - bash /scripts/setup.sh

persistence:
  data:
    # If create is true then the proceding values are used if
    # false then only claimName is required
    annotations: {}
    create: true
    accessMode: "ReadWriteMany"
    enabled: true
    size: 10Gi
    storageClass: efs-storage-class
    mountPath: /data

    # Only required if create = false
    claimName:
  logs:
    # If create is true then the proceding values are used if
    # false then only claimName is required
    annotations: {}
    create: false
    accessMode: ReadWriteOnce
    enabled: false
    size: 10Gi
    storageClass: default
    mountPath: /logs/

    # Only required if create = false
    claimName:


# This section builds out the service account more information can be found here: https://kubernetes.io/docs/concepts/security/service-accounts/
serviceAccount:
  # Specifies whether a service account should be created
  create: false
  # Automatically mount a ServiceAccount's API credentials?
  automount: true
  # Annotations to add to the service account
  annotations: {}
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name: ""

# This is for setting Kubernetes Annotations to a Pod.
# For more information checkout: https://kubernetes.io/docs/concepts/overview/working-with-objects/annotations/
podAnnotations: {}
# This is for setting Kubernetes Labels to a Pod.
# For more information checkout: https://kubernetes.io/docs/concepts/overview/working-with-objects/labels/
podLabels: {}

podSecurityContext: {}
  # fsGroup: 2000

# containerSecurityContext can be used to set the security context for the
containerSecurityContext: {}
  # allowPrivilegeEscalation: false
  # readOnlyRootFilesystem: false

# securityContext can be used to set the security context for the container
securityContext: {}
  # runAsUser: 1000
  # runAsGroup: 3000
  # fsGroup: 2000

# This is for setting up a service more information can be found here: https://kubernetes.io/docs/concepts/services-networking/service/
service:
  # This sets the service type more information can be found here: https://kubernetes.io/docs/concepts/services-networking/service/#publishing-services-service-types
  type: LoadBalancer
  # This sets the ports more information can be found here: https://kubernetes.io/docs/concepts/services-networking/service/#field-spec-ports
  ports:
    http: null
    gremlin:
     protocol: TCP
     port: 8182
     targetPort: 8182
  annotations:
    service.beta.kubernetes.io/aws-load-balancer-name: "janus-custom"
    service.beta.kubernetes.io/aws-load-balancer-scheme: "internet-facing"
    service.beta.kubernetes.io/load-balancer-source-ranges: "46.17.208.22/32,209.35.224.79/32,10.0.0.0/16,13.40.48.249/32,18.170.134.98/32"
  loadBalancerIP: ""
  loadBalancerSourceRanges: []

resources:
  requests:
    cpu: 2
    memory: 4Gi

envs:
  - name: JANUSGRAPH_RELATION_DELIMITER
    value: "@"


# This section is for setting up autoscaling more information can be found here: https://kubernetes.io/docs/concepts/workloads/autoscaling/
autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 100
  targetCPUUtilizationPercentage: 80

podDisruptionBudget:
  enabled: false
  minAvailable: 2

