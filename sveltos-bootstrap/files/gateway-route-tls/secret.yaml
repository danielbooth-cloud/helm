{{- /* Rendered by the event-manager: .Resource is the host's cert-manager Secret of a mirrored route. */ -}}
{{- $annotations := .Resource.metadata.annotations }}
{{- $destNamespace := index $annotations "bootstrap.projectsveltos.io/mirror-source-namespace" | default "" }}
{{- $destName := index $annotations "bootstrap.projectsveltos.io/mirror-source-name" | default "" }}
{{- $namespace := index $annotations "bootstrap.projectsveltos.io/route-namespace" | default "" }}
{{- $name := index $annotations "bootstrap.projectsveltos.io/route-tls-secret" | default "" }}
{{- if or (eq $destNamespace "") (eq $destName "") (eq $namespace "") (eq $name "") }}
{{- fail (printf "Secret %s/%s on %s/%s: no source vCluster route annotations" .Resource.metadata.namespace .Resource.metadata.name .Cluster.metadata.namespace .Cluster.metadata.name) }}
{{- end }}
{{- if and (eq $destNamespace .Cluster.metadata.namespace) (eq $destName .Cluster.metadata.name) }}
{{- fail (printf "Secret %s/%s: copy would target its own host %s/%s instead of the source vCluster" .Resource.metadata.namespace .Resource.metadata.name $destNamespace $destName) }}
{{- end }}
apiVersion: v1
kind: Secret
type: kubernetes.io/tls
metadata:
  # No source labels: vCluster syncs this Secret to the host, where the mirror label would retrigger the copy.
  name: {{ $name | quote }}
  namespace: {{ $namespace | quote }}
data:
  {{- toYaml .Resource.data | nindent 2 }}
