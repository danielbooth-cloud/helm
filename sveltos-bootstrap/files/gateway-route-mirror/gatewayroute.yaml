{{- /* Rendered by the event-manager: .Cluster is the virtual cluster, .Resource its GatewayRoute. */ -}}
{{- $annotations := .Cluster.metadata.annotations }}
{{- $vcluster := index $annotations "bootstrap.projectsveltos.io/vcluster-name" }}
{{- $namespace := .Resource.metadata.namespace }}
{{- /* serviceName becomes vCluster's single-namespace host name (SafeConcatName) of the synced Service. */ -}}
{{- $service := printf "%s-x-%s-x-%s" .Resource.spec.serviceName $namespace $vcluster }}
{{- if gt (len $service) 63 }}
{{- $service = replace ".-" "-" (printf "%s-%s" (trunc 52 $service) (trunc 10 (sha256sum $service))) }}
{{- end }}
{{- /* The route must not use vCluster's naming: vCluster would claim kro's HTTPRoute as a synced
copy and delete it. kro suffixes it (-tls, -https-redirect), so it stays well under 63. */ -}}
{{- /* spec.name is optional and defaults to the route's own name, as in the RGD. */ -}}
{{- $routeName := default .Resource.metadata.name (index .Resource.spec "name") }}
{{- $route := printf "%s-%s-%s" $vcluster $namespace $routeName }}
{{- if gt (len $route) 45 }}
{{- $route = printf "%s-%s" (trunc 34 $route | trimSuffix "-") (trunc 10 (sha256sum $route)) }}
{{- end }}
{{- $names := dict "route" $route "service" $service }}
{{- $spec := deepCopy .Resource.spec }}
{{- $_ := set $spec "name" $names.route }}
{{- $_ := set $spec "serviceName" $names.service }}
apiVersion: kro.run/v1alpha1
kind: GatewayRoute
metadata:
  name: {{ $names.route | quote }}
  namespace: {{ index $annotations "bootstrap.projectsveltos.io/host-namespace" | quote }}
  labels:
    # The status back-fill (gateway-route-status) selects the mirrors by this label.
    bootstrap.projectsveltos.io/gateway-route-mirror: "true"
  annotations:
    # Where kro's status is copied back to: the source vCluster's own SveltosCluster (.Cluster,
    # NOT its host-cluster-* annotations, which name this host) and the route's identity and
    # spec there, so the back-fill never has to reverse the naming above.
    bootstrap.projectsveltos.io/mirror-source-namespace: {{ .Cluster.metadata.namespace | quote }}
    bootstrap.projectsveltos.io/mirror-source-name: {{ .Cluster.metadata.name | quote }}
    bootstrap.projectsveltos.io/route-name: {{ .Resource.metadata.name | quote }}
    bootstrap.projectsveltos.io/route-namespace: {{ $namespace | quote }}
    bootstrap.projectsveltos.io/route-spec: {{ toYaml (deepCopy .Resource.spec) | quote }}
spec:
  {{- toYaml $spec | nindent 2 }}
