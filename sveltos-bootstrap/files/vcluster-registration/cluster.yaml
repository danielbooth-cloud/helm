{{- if not $onManagement }}
apiVersion: v1
kind: Namespace
metadata:
  name: {{ $namespace | quote }}
---
# Selectorless, so the host's same-named global Service supplies the only backend.
apiVersion: v1
kind: Service
metadata:
  name: {{ $capiCluster | quote }}
  namespace: {{ $namespace | quote }}
  annotations:
    service.cilium.io/global: "true"
    service.cilium.io/shared: "false"
spec:
  type: ClusterIP
  ports:
    - name: {{ $config.apiPortName | quote }}
      port: {{ $config.apiPort }}
      targetPort: {{ $config.apiTargetPort }}
      protocol: TCP
---
{{- end }}
apiVersion: lib.projectsveltos.io/v1beta1
kind: SveltosCluster
metadata:
  name: {{ $name | quote }}
  namespace: {{ $config.registrationNamespace | quote }}
  labels:
    bootstrap.projectsveltos.io/enabled: "true"
    bootstrap.projectsveltos.io/cluster: {{ $name | quote }}
    bootstrap.projectsveltos.io/virtual: "true"
    bootstrap.projectsveltos.io/clustermesh: "false"
    bootstrap.projectsveltos.io/host: {{ $host | quote }}
  annotations:
    bootstrap.projectsveltos.io/argocd-server: {{ $server | quote }}
    # Where its GatewayRoutes are mirrored: the host's SveltosCluster and the vCluster's host namespace.
    bootstrap.projectsveltos.io/host-cluster-namespace: {{ .Cluster.metadata.namespace | quote }}
    bootstrap.projectsveltos.io/host-cluster-name: {{ .Cluster.metadata.name | quote }}
    bootstrap.projectsveltos.io/host-namespace: {{ $namespace | quote }}
    bootstrap.projectsveltos.io/vcluster-name: {{ $capiCluster | quote }}
spec:
  kubeconfigName: {{ printf "%s%s" $name $config.kubeconfigSecretSuffix | quote }}
  kubeconfigKeyName: kubeconfig
