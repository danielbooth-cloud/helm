{{- /* Keep the CAPI credentials but dial the mesh Service name, which resolves on Ops. */ -}}
{{- $source := index .Resource.data "value" | b64dec | fromYaml }}
{{- $sourceCluster := index (first (index $source "clusters")) "cluster" }}
{{- $sourceUser := index (first (index $source "users")) "user" }}
{{- $clusters := list (dict "name" $name "cluster" (dict "server" $server "certificate-authority-data" (index $sourceCluster "certificate-authority-data"))) }}
{{- $contexts := list (dict "name" $name "context" (dict "cluster" $name "user" $name)) }}
{{- $kubeconfig := dict "apiVersion" "v1" "kind" "Config" "clusters" $clusters "users" (list (dict "name" $name "user" $sourceUser)) "contexts" $contexts "current-context" $name }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ printf "%s%s" $name $config.kubeconfigSecretSuffix | quote }}
  namespace: {{ $config.registrationNamespace | quote }}
type: Opaque
data:
  kubeconfig: {{ toYaml $kubeconfig | b64enc | quote }}
