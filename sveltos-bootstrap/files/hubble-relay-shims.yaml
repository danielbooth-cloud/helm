{{- /* Rendered by Sveltos on the management cluster. ClusterConfig.hubbleRelays is JSON:
       {"<namespace>": ["<node IP>", ...]}, one entry per remote cluster's relay. */ -}}
{{- $config := (getResource "ClusterConfig").data }}
{{- $port := (getResource "BootstrapSettings").data.hubbleRelayNodePort }}
{{- range $namespace, $addresses := fromJson (get $config "hubbleRelays" | default "{}") }}
---
# The Hubble UI and its GatewayRoute (GitOps system/hubble-proxy) deploy into this namespace.
apiVersion: v1
kind: Namespace
metadata:
  name: {{ $namespace | quote }}
  labels:
    gateway-access: "true"
---
# The UI always dials hubble-relay:80 in its own namespace; this maps it onto the remote
# cluster's hubble-relay-mesh NodePort.
apiVersion: v1
kind: Service
metadata:
  name: hubble-relay
  namespace: {{ $namespace | quote }}
spec:
  ports:
    - name: grpc
      port: 80
      targetPort: {{ $port }}
      protocol: TCP
---
apiVersion: discovery.k8s.io/v1
kind: EndpointSlice
metadata:
  name: hubble-relay
  namespace: {{ $namespace | quote }}
  labels:
    kubernetes.io/service-name: hubble-relay
addressType: IPv4
ports:
  - name: grpc
    port: {{ $port }}
    protocol: TCP
endpoints:
  {{- range $address := $addresses }}
  - addresses:
      - {{ $address | quote }}
    conditions:
      ready: true
  {{- end }}
{{- end }}
