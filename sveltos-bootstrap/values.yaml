      - apiVersion: v1
        kind: Namespace
        metadata:
          name: {{ $settings.clusterApiCoreNamespace | quote }}
      - apiVersion: operator.cluster.x-k8s.io/v1alpha2
        kind: CoreProvider
        metadata:
          name: cluster-api
          namespace: {{ $settings.clusterApiCoreNamespace | quote }}
        spec:
          version: {{ $settings.clusterApiVersion | quote }}
          # Provider manifests tolerate control planes; keep controllers on workers.
          deployment:
            affinity: &workers-only
              nodeAffinity:
                requiredDuringSchedulingIgnoredDuringExecution:
                  nodeSelectorTerms:
                    - matchExpressions:
                        - key: node-role.kubernetes.io/control-plane
                          operator: DoesNotExist
      - apiVersion: v1
        kind: Namespace
        metadata:
          name: {{ $settings.clusterApiVclusterNamespace | quote }}
      - apiVersion: operator.cluster.x-k8s.io/v1alpha2
        kind: InfrastructureProvider
        metadata:
          name: vcluster
          namespace: {{ $settings.clusterApiVclusterNamespace | quote }}
        spec:
          version: {{ $settings.clusterApiVclusterVersion | quote }}
          deployment:
            affinity: *workers-only
            containers:
              # The release manifest pins gcr.io/kubebuilder/kube-rbac-proxy, which no longer exists.
              - name: kube-rbac-proxy
                imageUrl: {{ $settings.clusterApiVclusterRbacProxyImage | quote }}
      # Global on the host so Ops' same-named shim Service gets the vCluster API as its only backend.
      - apiVersion: policies.kyverno.io/v1
        kind: MutatingPolicy
        metadata:
          name: vcluster-api-global-service
        spec:
          matchConstraints:
            resourceRules:
              - apiGroups:
                  - ""
                apiVersions:
                  - v1
                operations:
                  - CREATE
                  - UPDATE
                resources:
                  - services
            objectSelector:
              matchLabels: {{ $settings.vclusterApiServiceLabels }}
              matchExpressions:
                # Services a vCluster syncs out of its tenants carry this label.
                - key: vcluster.loft.sh/managed-by
                  operator: DoesNotExist
          mutations:
            - patchType: ApplyConfiguration
              applyConfiguration:
                expression: >-
                  Object{metadata: Object.metadata{annotations: {"service.cilium.io/global": "true"}}}
  kyverno: |
    # Chart defaults for now; add policies or tuning here as they earn their keep.
  descheduler: |
    # The chart's default profile plus an opt-out: pods or namespaces labelled
    # bootstrap.projectsveltos.io/descheduler=false are never evicted. Lists replace, so the whole profile is restated.
    deschedulerPolicy:
      profiles:
        - name: default
          pluginConfig:
            - name: DefaultEvictor
              args:
                labelSelector: &descheduler-opt-out
                  matchExpressions:
                    - key: bootstrap.projectsveltos.io/descheduler
                      operator: NotIn
                      values:
                        - "false"
                namespaceLabelSelector: *descheduler-opt-out
                podProtections:
                  defaultDisabled:
                    - PodsWithLocalStorage
                  extraEnabled:
                    - PodsWithPVC
            - name: RemoveDuplicates
            - name: RemovePodsHavingTooManyRestarts
              args:
                podRestartThreshold: 100
                includingInitContainers: true
            - name: RemovePodsViolatingNodeAffinity
              args:
                nodeAffinityType:
                  - requiredDuringSchedulingIgnoredDuringExecution
            - name: RemovePodsViolatingNodeTaints
            - name: RemovePodsViolatingInterPodAntiAffinity
            - name: RemovePodsViolatingTopologySpreadConstraint
            - name: LowNodeUtilization
              args:
                thresholds:
                  cpu: 20
                  memory: 20
                  pods: 20
                targetThresholds:
                  cpu: 50
                  memory: 50
                  pods: 50
          plugins:
            balance:
              enabled:
                - RemoveDuplicates
                - RemovePodsViolatingTopologySpreadConstraint
                - LowNodeUtilization
            deschedule:
              enabled:
                - RemovePodsHavingTooManyRestarts
                - RemovePodsViolatingNodeTaints
                - RemovePodsViolatingNodeAffinity
                - RemovePodsViolatingInterPodAntiAffinity
  gateway-route-rgd: |
    resources:
      - apiVersion: kro.run/v1alpha1
        kind: ResourceGraphDefinition
        metadata:
          name: gatewayroute.kro.run
        spec:
          resources:
            # The gateway's Tailscale proxy reports both its tailnet IP and its .ts.net
            # name. Routes publish only the IP: a public CNAME into MagicDNS can't resolve.
            - id: gateway
              externalRef:
                apiVersion: gateway.networking.k8s.io/v1
                kind: Gateway
                metadata:
                  name: {{ (getResource "BootstrapSettings").data.gatewayName | quote }}
                  namespace: {{ (getResource "BootstrapSettings").data.gatewayNamespace | quote }}
              readyWhen:
                - ${gateway.status.?addresses.orValue([]).exists(a, a.type == "IPAddress")}
            - id: certificate
              includeWhen:
                - ${schema.spec.tls}
              readyWhen:
                # cert-manager issued the certificate (tls=false excludes this resource, and kro
                # skips readiness for excluded resources).
                - ${certificate.?status.?conditions.orValue([]).exists(c, c.type == "Ready" && c.status == "True")}
              template:
                apiVersion: cert-manager.io/v1
                kind: Certificate
                metadata:
                  name: ${schema.spec.?name.orValue(schema.metadata.name)}-tls
                  namespace: ${schema.metadata.namespace}
                spec:
                  dnsNames:
                    - ${schema.spec.hostname}
                  issuerRef:
                    kind: ClusterIssuer
                    name: {{ (getResource "BootstrapSettings").data.issuerName | quote }}
                  secretName: ${schema.spec.?name.orValue(schema.metadata.name)}-tls
            - id: listenerSetTLS
              includeWhen:
                - ${schema.spec.tls}
              readyWhen:
                # The Gateway admitted the listeners: False/NotAllowed when the namespace lacks
                # the gateway-access label, or on a hostname/port conflict.
                - ${listenerSetTLS.?status.?conditions.orValue([]).exists(c, c.type == "Accepted" && c.status == "True")}
                - ${listenerSetTLS.?status.?conditions.orValue([]).exists(c, c.type == "Programmed" && c.status == "True")}
              template:
                apiVersion: gateway.networking.k8s.io/v1
                kind: ListenerSet
                metadata:
                  name: ${schema.spec.?name.orValue(schema.metadata.name)}
                  namespace: ${schema.metadata.namespace}
                  annotations:
                    external-dns.kubernetes.io/target: ${gateway.status.addresses.filter(a, a.type == "IPAddress")[0].value}
                spec:
                  listeners:
                    - allowedRoutes:
                        namespaces:
                          from: Same
                      hostname: ${schema.spec.hostname}
                      name: ${schema.spec.?name.orValue(schema.metadata.name)}
                      port: 443
                      protocol: HTTPS
                      tls:
                        certificateRefs:
                          - name: ${schema.spec.?name.orValue(schema.metadata.name)}-tls
                        mode: Terminate
                    - allowedRoutes:
                        namespaces:
                          from: Same
                      hostname: ${schema.spec.hostname}
                      name: ${schema.spec.?name.orValue(schema.metadata.name)}-http
                      port: 80
                      protocol: HTTP
                  parentRef:
                    group: gateway.networking.k8s.io
                    kind: Gateway
                    name: {{ (getResource "BootstrapSettings").data.gatewayName | quote }}
                    namespace: {{ (getResource "BootstrapSettings").data.gatewayNamespace | quote }}
            - id: listenerSetHTTP
              includeWhen:
                - ${!schema.spec.tls}
              readyWhen:
                # The Gateway admitted the listeners: False/NotAllowed when the namespace lacks
                # the gateway-access label, or on a hostname/port conflict.
                - ${listenerSetHTTP.?status.?conditions.orValue([]).exists(c, c.type == "Accepted" && c.status == "True")}
                - ${listenerSetHTTP.?status.?conditions.orValue([]).exists(c, c.type == "Programmed" && c.status == "True")}
              template:
                apiVersion: gateway.networking.k8s.io/v1
                kind: ListenerSet
                metadata:
                  name: ${schema.spec.?name.orValue(schema.metadata.name)}
                  namespace: ${schema.metadata.namespace}
                  annotations:
                    external-dns.kubernetes.io/target: ${gateway.status.addresses.filter(a, a.type == "IPAddress")[0].value}
                spec:
                  listeners:
                    - allowedRoutes:
                        namespaces:
                          from: Same
                      hostname: ${schema.spec.hostname}
                      name: ${schema.spec.?name.orValue(schema.metadata.name)}
                      port: 80
                      protocol: HTTP
                  parentRef:
                    group: gateway.networking.k8s.io
                    kind: Gateway
                    name: {{ (getResource "BootstrapSettings").data.gatewayName | quote }}
                    namespace: {{ (getResource "BootstrapSettings").data.gatewayNamespace | quote }}
            - id: httpsRedirect
              includeWhen:
                - ${schema.spec.tls}
              readyWhen:
                # Every parent accepted the route and every backendRef resolved (missing Service,
                # wrong port, or a cross-namespace ref without its ReferenceGrant).
                - >-
                  ${httpsRedirect.?status.?parents.orValue([]).size() > 0
                  && httpsRedirect.?status.?parents.orValue([]).all(p, p.?conditions.orValue([]).exists(c, c.type == "Accepted" && c.status == "True"))
                  && httpsRedirect.?status.?parents.orValue([]).all(p, p.?conditions.orValue([]).exists(c, c.type == "ResolvedRefs" && c.status == "True"))}
              template:
                apiVersion: gateway.networking.k8s.io/v1
                kind: HTTPRoute
                metadata:
                  name: ${schema.spec.?name.orValue(schema.metadata.name)}-https-redirect
                  namespace: ${schema.metadata.namespace}
                spec:
                  hostnames:
                    - ${schema.spec.hostname}
                  parentRefs:
                    - group: gateway.networking.k8s.io
                      kind: ListenerSet
                      name: ${schema.spec.?name.orValue(schema.metadata.name)}
                      sectionName: ${schema.spec.?name.orValue(schema.metadata.name)}-http
                  rules:
                    - filters:
                        - requestRedirect:
                            port: 443
                            scheme: https
                            statusCode: 301
                          type: RequestRedirect
            - id: route
              includeWhen:
                # No auth proxy configured: backend is the target service directly.
                - ${schema.spec.?authProxy.?backendRef.?name.orValue("") == ""}
              readyWhen:
                # Every parent accepted the route and every backendRef resolved (missing Service,
                # wrong port, or a cross-namespace ref without its ReferenceGrant).
                - >-
                  ${route.?status.?parents.orValue([]).size() > 0
                  && route.?status.?parents.orValue([]).all(p, p.?conditions.orValue([]).exists(c, c.type == "Accepted" && c.status == "True"))
                  && route.?status.?parents.orValue([]).all(p, p.?conditions.orValue([]).exists(c, c.type == "ResolvedRefs" && c.status == "True"))}
              template:
                apiVersion: gateway.networking.k8s.io/v1
                kind: HTTPRoute
                metadata:
                  annotations:
                    external-dns.kubernetes.io/enabled: "true"
                  name: ${schema.spec.?name.orValue(schema.metadata.name)}
                  namespace: ${schema.metadata.namespace}
                spec:
                  hostnames:
                    - ${schema.spec.hostname}
                  parentRefs:
                    - group: gateway.networking.k8s.io
                      kind: ListenerSet
                      name: ${schema.spec.?name.orValue(schema.metadata.name)}
                      sectionName: ${schema.spec.?name.orValue(schema.metadata.name)}
                  rules:
                    - matches:
                        - path:
                            type: PathPrefix
                            value: ${schema.spec.pathPrefix}
                      # Omitted fields keep Envoy's defaults (a 15s route timeout, which cuts
                      # off streams: SSE, LLM responses, long queries); "0s" disables one.
                      # Optional map entries (?key) drop unset fields. Keep the space after the
                      # opening ${ : two adjacent braces would start a Sveltos template action.
                      timeouts: '${ {?"request": schema.spec.?timeouts.?request, ?"backendRequest": schema.spec.?timeouts.?backendRequest} }'
                      backendRefs:
                        - name: ${schema.spec.serviceName}
                          port: ${schema.spec.servicePort}
            - id: routeAuthProxy
              includeWhen:
                # Auth proxy configured: backend is the existing proxy Service, which
                # authenticates the user (redirect flow, session cookie) and forwards to
                # the target service. Mutually exclusive with `route` above.
                - ${schema.spec.?authProxy.?backendRef.?name.orValue("") != ""}
              readyWhen:
                # Every parent accepted the route and every backendRef resolved (missing Service,
                # wrong port, or a cross-namespace ref without its ReferenceGrant).
                - >-
                  ${routeAuthProxy.?status.?parents.orValue([]).size() > 0
                  && routeAuthProxy.?status.?parents.orValue([]).all(p, p.?conditions.orValue([]).exists(c, c.type == "Accepted" && c.status == "True"))
                  && routeAuthProxy.?status.?parents.orValue([]).all(p, p.?conditions.orValue([]).exists(c, c.type == "ResolvedRefs" && c.status == "True"))}
              template:
                apiVersion: gateway.networking.k8s.io/v1
                kind: HTTPRoute
                metadata:
                  annotations:
                    external-dns.kubernetes.io/enabled: "true"
                  name: ${schema.spec.?name.orValue(schema.metadata.name)}
                  namespace: ${schema.metadata.namespace}
                spec:
                  hostnames:
                    - ${schema.spec.hostname}
                  parentRefs:
                    - group: gateway.networking.k8s.io
                      kind: ListenerSet
                      name: ${schema.spec.?name.orValue(schema.metadata.name)}
                      sectionName: ${schema.spec.?name.orValue(schema.metadata.name)}
                  rules:
                    - matches:
                        - path:
                            type: PathPrefix
                            value: ${schema.spec.pathPrefix}
                      # Omitted fields keep Envoy's defaults (a 15s route timeout, which cuts
                      # off streams: SSE, LLM responses, long queries); "0s" disables one.
                      # Optional map entries (?key) drop unset fields. Keep the space after the
                      # opening ${ : two adjacent braces would start a Sveltos template action.
                      timeouts: '${ {?"request": schema.spec.?timeouts.?request, ?"backendRequest": schema.spec.?timeouts.?backendRequest} }'
                      backendRefs:
                        - name: ${schema.spec.authProxy.backendRef.name}
                          # Empty namespace means same-namespace; emit it explicitly.
                          namespace: ${schema.spec.authProxy.backendRef.?namespace.orValue(schema.metadata.namespace)}
                          port: ${schema.spec.authProxy.backendRef.port}
            - id: authProxyReferenceGrant
              includeWhen:
                - ${schema.spec.?authProxy.?backendRef.?name.orValue("") != ""}
                # Only cross-namespace backend references need a grant.
                - ${schema.spec.?authProxy.?backendRef.?namespace.orValue("") != ""}
              template:
                apiVersion: gateway.networking.k8s.io/v1beta1
                kind: ReferenceGrant
                metadata:
                  name: ${schema.spec.?name.orValue(schema.metadata.name)}-authproxy
                  namespace: ${schema.spec.authProxy.backendRef.namespace}
                spec:
                  from:
                    - group: gateway.networking.k8s.io
                      kind: HTTPRoute
                      namespace: ${schema.metadata.namespace}
                  to:
                    - group: ""
                      kind: Service
                      name: ${schema.spec.authProxy.backendRef.name}
            - id: authProxyLockdown
              includeWhen:
                # Pod labels supplied: lock the app to cluster-internal ingress. Blocks
                # gateway-Envoy (reserved:ingress) traffic to the app directly; external
                # callers must go through the auth proxy, in-cluster callers are unaffected.
                - ${schema.spec.?authProxy.?podSelector.orValue({}).size() > 0}
              template:
                apiVersion: cilium.io/v2
                kind: CiliumNetworkPolicy
                metadata:
                  name: ${schema.spec.?name.orValue(schema.metadata.name)}-auth-proxy-locked
                  namespace: ${schema.metadata.namespace}
                spec:
                  endpointSelector:
                    matchLabels: "${schema.spec.authProxy.podSelector}"
                  ingress:
                    - fromEntities:
                        - cluster
          schema:
            apiVersion: v1alpha1
            kind: GatewayRoute
            spec:
              hostname: string
              # Prefix of every generated resource; defaults to metadata.name.
              name: string
              serviceName: string
              servicePort: integer | default=80
              # Limits the route to one API, e.g. Mimir's push endpoint without its query API.
              pathPrefix: string | default="/"
              tls: boolean | default=true
              # Gateway API HTTPRoute rule timeouts (durations like "30s", "5m", "0s" =
              # disabled). No CRD defaults, so unset fields never show up as GitOps drift.
              timeouts:
                request: string
                backendRequest: string
              # Optional oauth2-proxy in front of the route. Omitted/null = disabled: the
              # route behaves exactly as before. The proxy is NOT deployed by this RGD; it
              # must already exist (in-cluster or reachable via ClusterMesh). When set, the
              # route's backend becomes the proxy Service, which authenticates the user and
              # forwards to the target service.
              authProxy:
                # The existing auth proxy Service. No CRD defaults on these fields on
                # purpose: API-server defaulting would inject them into every live
                # object and show as permanent drift in GitOps diffs. When configuring,
                # specify the full backendRef including port.
                backendRef:
                  name: string
                  namespace: string
                  port: integer
                # Optional lockdown: pod labels of the target service's pods. When set, a
                # CiliumNetworkPolicy allows ingress to those pods from cluster entities
                # only. The gateway's Envoy carries Cilium's reserved ingress identity, so
                # external callers can no longer reach the app directly — they must go
                # through the auth proxy (whose pods are cluster entities), while in-cluster
                # API callers keep working unchanged. Flat map of pod labels, used directly
                # as the CNP's endpointSelector.matchLabels. Host-cluster workloads only:
                # vCluster-mirrored routes proxy to ClusterMesh Services whose pods are
                # not selectable from the host.
                podSelector: "map[string]string"
            status:
              # Where the route is served, e.g. https://grafana.lab.danielbooth.cloud.
              url: >-
                ${(schema.spec.tls ? "https://" : "http://") + schema.spec.hostname
                + (schema.spec.pathPrefix == "/" ? "" : schema.spec.pathPrefix)}
              # The Tailscale gateway's .ts.net DNS name, falling back to its tailnet IP
              # if it reports no hostname. (The external-dns target annotations above keep
              # using the IP: a public CNAME into MagicDNS can't resolve.)
              address: >-
                ${gateway.status.?addresses.orValue([]).filter(a, a.type == "Hostname").size() > 0
                ? gateway.status.addresses.filter(a, a.type == "Hostname")[0].value
                : gateway.status.?addresses.orValue([]).filter(a, a.type == "IPAddress").size() > 0
                ? gateway.status.addresses.filter(a, a.type == "IPAddress")[0].value
                : ""}
              # cert-manager's Ready condition reason ("Issued"). The ternary guards the
              # empty-list index for tls=false instances, where the certificate resource
              # is not part of the graph and the optional chain unwraps to an empty list.
              certificate: >-
                ${certificate.?status.?conditions.orValue([]).filter(c, c.type == "Ready").size() > 0 ? certificate.?status.?conditions.orValue([]).filter(c, c.type == "Ready")[0].?reason.orValue("") : ""}
            # Defining any printer column replaces kro's defaults, so all of kro's
            # (State/Ready/Age, see kro pkg/graph/crd/defaults.go) are repeated here.
            additionalPrinterColumns:
              - name: State
                type: string
                jsonPath: .status.state
              - name: Ready
                type: string
                jsonPath: .status.conditions[?(@.type=="Ready")].status
              # priority 1 = only shown with -o wide. Address is the public hostname the
              # route serves; the gateway's tailnet address stays in .status.address.
              - name: Address
                type: string
                jsonPath: .spec.hostname
                priority: 1
              - name: URL
                type: string
                jsonPath: .status.url
                priority: 1
              - name: Certificate
                type: string
                jsonPath: .status.certificate
                priority: 1
              - name: AuthProxy
                type: string
                jsonPath: .spec.authProxy.backendRef.name
                priority: 1
              - name: Age
                type: date
                jsonPath: .metadata.creationTimestamp
                priority: 1
  kubelet-csr-approver: |
    providerRegex: {{ (getResource "ClusterConfig").data.kubeletProviderRegex | quote }}
    providerIpPrefixes:
      - {{ (getResource "ClusterConfig").data.kubeletProviderIpPrefix | quote }}
    allowedDnsNames: 1
    bypassDnsResolution: true
    bypassHostnameCheck: false
    ignoreNonSystemNode: false
    skipDenyStep: false
    leaderElection: true
    replicas: 2
    priorityClassName: system-cluster-critical
  metrics-server: |
    apiService:
      insecureSkipTLSVerify: false
    tls:
      certManager:
        addInjectorAnnotations: true
        existingIssuer:
          enabled: false
      type: cert-manager
  prometheus: |
    alertmanager:
      enabled: false
    kube-state-metrics:
      enabled: false
    prometheus-node-exporter:
      enabled: false
    prometheus-pushgateway:
      enabled: false
    scrapeConfigs:
      kubernetes-pods:
        pre_relabel_configs: |
          - source_labels: [__meta_kubernetes_pod_container_init]
            action: drop
            regex: 'true'
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape_via_service]
            action: drop
            regex: 'true'
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_port]
            regex: '([0-9]+)'
            target_label: __tmp_expected_metrics_port
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_port, __meta_kubernetes_pod_container_port_number]
            regex: ';([0-9]+)'
            target_label: __tmp_expected_metrics_port
          - source_labels: [__meta_kubernetes_pod_container_port_number]
            regex: '([0-9]+)'
            target_label: __tmp_discovered_metrics_port
          - source_labels: [__meta_kubernetes_pod_container_port_number, __meta_kubernetes_pod_annotation_prometheus_io_port]
            regex: ';([0-9]+)'
            target_label: __tmp_discovered_metrics_port
          - source_labels: [__tmp_discovered_metrics_port]
            action: keepequal
            target_label: __tmp_expected_metrics_port
      kubernetes-pods-slow:
        pre_relabel_configs: |
          - source_labels: [__meta_kubernetes_pod_container_init]
            action: drop
            regex: 'true'
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape_via_service]
            action: drop
            regex: 'true'
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_port]
            regex: '([0-9]+)'
            target_label: __tmp_expected_metrics_port
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_port, __meta_kubernetes_pod_container_port_number]
            regex: ';([0-9]+)'
            target_label: __tmp_expected_metrics_port
          - source_labels: [__meta_kubernetes_pod_container_port_number]
            regex: '([0-9]+)'
            target_label: __tmp_discovered_metrics_port
          - source_labels: [__meta_kubernetes_pod_container_port_number, __meta_kubernetes_pod_annotation_prometheus_io_port]
            regex: ';([0-9]+)'
            target_label: __tmp_discovered_metrics_port
          - source_labels: [__tmp_discovered_metrics_port]
            action: keepequal
            target_label: __tmp_expected_metrics_port
      kubernetes-service-endpoints:
        pre_relabel_configs: |
          - source_labels: [__meta_kubernetes_endpointslice_port]
            action: keep
            regex: '[0-9]+'
          - source_labels: [__meta_kubernetes_service_label_prometheus_io_service_monitor]
            action: drop
            regex: 'false'
          - source_labels: [__meta_kubernetes_service_annotation_prometheus_io_port]
            regex: '([0-9]+)'
            target_label: __tmp_expected_metrics_port
          - source_labels: [__meta_kubernetes_service_annotation_prometheus_io_port, __meta_kubernetes_endpointslice_port]
            regex: ';([0-9]+)'
            target_label: __tmp_expected_metrics_port
          - source_labels: [__meta_kubernetes_endpointslice_port]
            target_label: __tmp_discovered_metrics_port
          - source_labels: [__tmp_discovered_metrics_port]
            action: keepequal
            target_label: __tmp_expected_metrics_port
      kubernetes-service-endpoints-slow:
        pre_relabel_configs: |
          - source_labels: [__meta_kubernetes_endpointslice_port]
            action: keep
            regex: '[0-9]+'
          - source_labels: [__meta_kubernetes_service_label_prometheus_io_service_monitor]
            action: drop
            regex: 'false'
          - source_labels: [__meta_kubernetes_service_annotation_prometheus_io_port]
            regex: '([0-9]+)'
            target_label: __tmp_expected_metrics_port
          - source_labels: [__meta_kubernetes_service_annotation_prometheus_io_port, __meta_kubernetes_endpointslice_port]
            regex: ';([0-9]+)'
            target_label: __tmp_expected_metrics_port
          - source_labels: [__meta_kubernetes_endpointslice_port]
            target_label: __tmp_discovered_metrics_port
          - source_labels: [__tmp_discovered_metrics_port]
            action: keepequal
            target_label: __tmp_expected_metrics_port
    server:
      defaultFlagsOverride:
        - --agent
        - --config.file=/etc/config/prometheus.yml
        - --web.enable-lifecycle
        - --storage.agent.path=/prometheus
        - --storage.agent.retention.max-time=2h
      extraSecretMounts: []
      global:
        external_labels:
          cluster: {{ (getResource "ClusterConfig").data.clusterName | quote }}
          environment: {{ (getResource "ClusterConfig").data.environment | quote }}
      persistentVolume:
        enabled: true
        mountPath: /prometheus
        size: 1Gi
        storageClass: {{ (getResource "ClusterConfig").data.prometheusStorageClass | quote }}
      remoteWrite:
        - url: {{ (getResource "ClusterConfig").data.prometheusRemoteWriteUrl | quote }}
    serverFiles:
      prometheus.yml:
        rule_files: []
  reloader: |
    reloader:
      reloadOnCreate: true
      reloadOnDelete: true
      deployment:
        pod:
          annotations:
            prometheus.io/path: /metrics
            prometheus.io/port: "9090"
            prometheus.io/scrape: "true"
  tailscale-operator: |
    apiServerProxyConfig:
      allowImpersonation: "true"
      mode: "false"
    ingressClass:
      enabled: false
    installCRDs: true
    oauth:
      clientId: {{ (getResource "ClusterConfig").data.tailscaleClientId | quote }}
      clientSecret: {{ index (getResource "BootstrapCredentials").data "tailscale-client-secret" | b64dec | quote }}
    operatorConfig:
      defaultTags:
        - tag:k8s-operator
      hostname: {{ default (printf "tailscale-operator-%s-%s" .Cluster.metadata.namespace .Cluster.metadata.name) (index ((index .Cluster.metadata "annotations") | default dict) "bootstrap.projectsveltos.io/tailscale-hostname") | quote }}
      image:
        digest: ""
        pullPolicy: Always
        repository: tailscale/k8s-operator
        tag: ""
      logging: info
      nodeSelector:
        kubernetes.io/os: linux
      podAnnotations:
        prometheus.io/path: /metrics
        prometheus.io/port: "8080"
        prometheus.io/scrape: "true"
    proxyConfig:
      # Created by this profile's tailscale-proxy-class release.
      defaultProxyClass: {{ (getResource "BootstrapSettings").data.tailscaleProxyClass | quote }}
      defaultTags: tag:k8s
      firewallMode: auto
      image:
        digest: ""
        repository: tailscale/tailscale
        tag: ""
  tailscale-proxy-class: |
    resources:
      - apiVersion: tailscale.com/v1alpha1
        kind: ProxyClass
        metadata:
          name: {{ (getResource "BootstrapSettings").data.tailscaleProxyClass | quote }}
        spec:
          statefulSet:
            pod:
              tailscaleContainer:
                env:
                  # Read once when the TUN is created; see settings.tailscaleProxyMtu.
                  - name: TS_DEBUG_MTU
                    value: {{ (getResource "BootstrapSettings").data.tailscaleProxyMtu | quote }}
