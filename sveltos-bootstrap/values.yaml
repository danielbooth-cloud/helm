profilePrefix: bootstrap
managementCluster:
  namespace: mgmt
  name: mgmt
  # The SveltosCluster's registration cluster label, which the profiles select on.
  cluster: ""
  # The bootstrap.projectsveltos.io/role label the publisher sets on the management SveltosCluster;
  # mgmt-only profiles select it and workload-only profiles exclude it.
  role: mgmt
sharedClusterConfig: {}
clusterConfig: {}
managementResources: []
credentials: {}
deploymentRevision: ""

clusterMesh:
  # IPs peers dial (plus loopback); the apiserver cert carries them as SANs.
  apiserverIpAddresses:
    - 127.0.0.1
    - "::1"
  issuerName: cilium-mesh
  caSecretName: cilium-mesh-ca
  caItem: cilium-mesh-ca
  caCertificateField: certificate
  caPrivateKeyField: private-key
  certificateDuration: 2160h
  certificateRenewBefore: 360h
  hubbleTlsSecretPrefix: hubble-mesh

# Workload clusters register themselves here from their own Terraform stacks; the
# ClusterConfig ConfigMaps the profiles reference live here too (the registrar's
# release namespace).
registrationNamespace: clusters

# Registers each cluster with Sveltos by writing its kubeconfig here when Terraform
# writes its Omni account key Secret; enabled with the registration path in omni/cluster.
sveltosRegistration:
  enabled: false
  image: alpine/k8s:1.37.2
  omnictl:
    version: 1.13.2
    sha256: 4e712b0f1fee84d89b1e8fa6ccf8618991e2167c8c6b533c9e7df16afd7b1286
  # Reachable from this cluster only; the kubeconfig it writes targets the k8s proxy.
  omniEndpoint: ""
  kubeconfigSecretSuffix: -sveltos-kubeconfig
  kubeconfig:
    # Bound through the sveltos-bootstrap ClusterRole every cluster applies at bootstrap.
    user: sveltos
    # Long-lived so a dropped event cannot strand a cluster; a key rotation rewrites it.
    ttl: 8760h
    groups:
      - sveltos:bootstrap

# Argo CD on the management cluster only; workload clusters get the registration profile.
argocd:
  enabled: false

# Cluster API with the vCluster infrastructure provider, on every non-virtual cluster.
clusterApi:
  operatorNamespace: capi-operator-system
  coreNamespace: capi-system
  vclusterNamespace: vcluster-infrastructure-system

# Registers CAPI-provisioned vClusters as virtual SveltosClusters; see templates/vcluster-registration.yaml.tpl.
vclusterRegistration:
  # The vCluster chart's API Service, named after the CAPI Cluster in that Cluster's namespace.
  apiPortName: https
  apiPort: 443
  apiTargetPort: 8443
  # Kyverno marks matching host-side Services Cluster Mesh global so Ops reaches the API.
  apiServiceLabels:
    app: vcluster


namespaces:
  certManager: cert-manager
  onepassword: onepassword
  externalDns: external-dns
  externalSecrets: external-secrets
  reloader: reloader
  kro: kro-system
  kyverno: kyverno
  monitoring: monitoring
  tailscale: tailscale-operator
  ceph: ceph-system
  gateway: gateway
  kubeSystem: kube-system
  argocd: argocd

# Namespaces virtual clusters get; onepassword and ceph-system come from the vCluster's replicated Services.
virtualNamespaces:
  - reloader
  - externalSecrets

namespaceLabels:
  monitoring:
    gateway-access: "true"
  argocd:
    gateway-access: "true"
  tailscale:
    pod-security.kubernetes.io/enforce: privileged
  # Node plugins run privileged on the host network.
  ceph:
    pod-security.kubernetes.io/enforce: privileged

namespacePolicyPreamble: |
  {{- $clusterConfig := getResource "ClusterConfig" -}}
  {{- if ne (index .Cluster.metadata.labels "bootstrap.projectsveltos.io/cluster") $clusterConfig.data.clusterName -}}
  {{- fail "Registration cluster label and clusterName must match" -}}
  {{- end }}

settings:
  secretStoreName: onepassword
  connectTokenSecretName: onepassword-connect-token
  connectCredentialsSecretName: op-credentials
  # ClusterConfig supplies the hosts and port; this is the alias's name.
  s3ServiceName: s3
  issuerName: zerossl-issuer
  eabSecretName: zerossl-eab-secret
  acmeAccountSecretName: zerossl-production
  certificateCloudflareSecretName: cloudflare-api-token-secret
  dnsCloudflareSecretName: external-dns-cloudflare
  cloudflareSecretKey: api-token
  cloudflareSecretItem: cloudflare
  cloudflareSecretField: account-api-token
  # Cilium north-south Gateway that GatewayRoutes attach to.
  gatewayName: gateway
  gatewayNamespace: ""
  # Default ProxyClass for every Tailscale operator proxy (Gateway, LoadBalancers).
  tailscaleProxyClass: pod-network
  # Tailscale TUN MTU for proxies on the pod network. Cilium (tunnel mode) gives pods a
  # route MTU of its MTU minus 50 (VXLAN): 1300 - 50 = 1250. WireGuard needs up to 80 more,
  # so 1250 - 80 = 1170. Tailscale's default 1280 makes ~1340-byte packets that fragment
  # on the way out and lose enough to stall TCP (~85 KB/s downloads through the Gateway).
  # Always Cilium's MTU - 50 - 80: change it whenever Cilium's MTU changes (IaC
  # cilium_values.MTU), then roll the proxies, which read it only at start.
  tailscaleProxyMtu: "1170"

versions:
  raw: 2.0.2
  reloader: 2.2.17
  externalSecrets: 2.10.0
  tailscale: 1.102.4
  prometheus: 29.36.1
  certManager: v1.21.2
  k8sSecrets: 2.0.0
  certManagerIssuers: 0.3.0
  externalDns: 1.22.0
  kro: 0.9.4
  metricsServer: 3.13.1
  kyverno: 3.10.0
  descheduler: 0.37.0
  kubeletCsrApprover: 1.2.15
  cephCsi: 3.18.1
  onePasswordConnect: 2.4.3
  argoCd: 10.17.2
  clusterApiOperator: 0.30.0
  clusterApi: v1.14.4
  clusterApiVcluster: v0.2.2
  # Same upstream image the provider manifest used, from its current registry.
  clusterApiVclusterRbacProxy: quay.io/brancz/kube-rbac-proxy:v0.8.0

# These are Sveltos value documents, deliberately emitted without Helm tpl.
applicationValues:
  argocd: |
    fullnameOverride: argocd
    createClusterRoles: true
    crds:
      install: true
      keep: true
    global:
      domain: {{ (getResource "ClusterConfig").data.argocdDomain | quote }}
    configs:
      params:
        # The north-south Gateway terminates TLS, so its GatewayRoute targets a plaintext Service.
        server.insecure: true
      cm:
        url: {{ printf "https://%s" (getResource "ClusterConfig").data.argocdDomain | quote }}
        # Read-only API account for the homepage dashboard; the token is minted by hand.
        accounts.homepage: apiKey
        # Direct OIDC against tsidp; dex stays disabled. Redirect URI is <url>/auth/callback.
        oidc.config: |
          name: {{ (getResource "ClusterConfig").data.argocdOidcName }}
          issuer: {{ (getResource "ClusterConfig").data.argocdOidcIssuer }}
          clientID: ${{ (getResource "ClusterConfig").data.argocdOidcSecretName }}:clientID
          clientSecret: ${{ (getResource "ClusterConfig").data.argocdOidcSecretName }}:clientSecret
          requestedScopes: ["openid", "email", "profile"]
        # Argo CD 3.6 ships a built-in Kro instance health check (kro.run/_): no status =
        # Progressing, and Ready conditions only count when observedGeneration matches the
        # local generation. Neither holds for a vCluster's GatewayRoute: kro only reconciles
        # the host-side mirror, and the status back-fill copies the host's conditions over
        # verbatim, so their observedGeneration can never match the local generation. This
        # kind-level override replaces the wildcard check and drops the generation gate: the
        # back-filled status is the real signal (Ready=True/Active = Healthy, Failed/Error =
        # Degraded), so no per-app ignore-healthcheck annotation is needed.
        resource.customizations.health.kro.run_GatewayRoute: |
          -- No string library in Argo CD's Lua sandbox: match kro's states (ACTIVE,
          -- IN_PROGRESS, FAILED, ERROR) through literal lookup tables, both casings.
          healthy = {ACTIVE = true, Active = true}
          degraded = {FAILED = true, Failed = true, ERROR = true, Error = true}
          hs = {}
          state = ""
          ready = false
          message = ""
          if obj.status ~= nil then
            if obj.status.state ~= nil then state = obj.status.state end
            if obj.status.conditions ~= nil then
              for _, condition in ipairs(obj.status.conditions) do
                if condition.type == "Ready" then
                  ready = condition.status == "True"
                  if condition.message ~= nil then message = condition.message end
                end
              end
            end
          end
          if ready or healthy[state] then
            hs.status = "Healthy"
            hs.message = message
          elseif degraded[state] then
            hs.status = "Degraded"
            hs.message = message
          else
            hs.status = "Progressing"
            hs.message = "waiting for GatewayRoute status"
          end
          return hs
        # Deep link on every GatewayRoute in the Argo CD UI, from the route's status.url.
        # The {{ "{{" }} escapes keep Argo CD's own template out of Sveltos' rendering.
        resource.links: |
          - title: Open
            url: '{{ "{{" }}.resource.status.url{{ "}}" }}'
            icon.class: fa-external-link
            if: resource.apiVersion == "kro.run/v1alpha1" && resource.kind == "GatewayRoute" && resource.status != nil && resource.status.url != nil
      rbac:
        # tsidp asserts no groups, so the policy is matched on the email claim.
        policy.default: {{ (getResource "ClusterConfig").data.argocdRbacDefault | quote }}
        policy.csv: |
          g, {{ (getResource "ClusterConfig").data.argocdAdminIdentity }}, role:admin
          # Read-only over every application, for the homepage account only.
          p, role:homepage, applications, get, */*, allow
          g, homepage, role:homepage
        scopes: '[email]'
      # Replaces the plugin.yaml baked into the camptocamp helmfile image (mounted below).
      # - Argo CD hands each Application's plugin.env to the plugin as ARGOCD_ENV_<name>, but
      #   camptocamp's script only reads the unprefixed HELMFILE_GLOBAL_OPTIONS, so this
      #   re-exports that one variable and nothing else.
      # - The script passes --namespace $ARGOCD_APP_NAMESPACE, which overrides every release's
      #   namespace; unsetting it keeps the namespaces the helmfiles declare.
      cmp:
        create: true
        plugins:
          helmfile:
            init:
              command: [bash, -c]
              args:
                - export HELMFILE_GLOBAL_OPTIONS="${ARGOCD_ENV_HELMFILE_GLOBAL_OPTIONS:-}"; unset ARGOCD_APP_NAMESPACE; exec /usr/local/bin/argocd-helmfile init
            generate:
              command: [bash, -c]
              args:
                - export HELMFILE_GLOBAL_OPTIONS="${ARGOCD_ENV_HELMFILE_GLOBAL_OPTIONS:-}"; unset ARGOCD_APP_NAMESPACE; exec /usr/local/bin/argocd-helmfile generate
            # A glob: matches helmfile.yaml and helmfile.yaml.gotmpl. Argo CD runs discovery even
            # for Applications that name the plugin, so it has to match both.
            discover:
              fileName: helmfile.yaml*
    server:
      deploymentAnnotations:
        reloader.stakater.com/auto: "true"
        # argocd-cm names the OIDC client Secret instead of referencing it, so auto-reload cannot see it.
        secret.reloader.stakater.com/reload: {{ (getResource "ClusterConfig").data.argocdOidcSecretName | quote }}
      service:
        # Advertised to the Cluster Mesh, so every peer's selectorless argocd-server stub
        # (argocd-mesh) resolves to the hub's pods; the hub has the only endpoints.
        annotations:
          service.cilium.io/global: "true"
        # Extra port on the same container port only because the kro GatewayRoute targets
        # 8080. The appProtocol MUST stay HTTP/1.1: argocd-server's 8080 serves REST and
        # gRPC-web over h1 and resets raw h2c, so an h2c appProtocol makes Cilium's Envoy
        # speak h2 upstream and every request through the gateway 503s (upstream
        # connection termination). Downstream h2 at the gateway TLS listener is unrelated:
        # it comes from gatewayAPI.enableAlpn=true in the Cilium install (IaC). The argocd
        # CLI uses gRPC-web over h1, which Envoy proxies fine.
        servicePortHttp2: 8080
        servicePortHttp2AppProtocol: kubernetes.io/http
    repoServer:
      # No environment in the sidecar: each Application selects its helmfile environment with the
      # HELMFILE_GLOBAL_OPTIONS parameter (-e <overlay>), re-exported unprefixed by configs.cmp above.
      # The plugin config is mounted as a single file, which does not update in place; restart on change.
      deploymentAnnotations:
        configmap.reloader.stakater.com/reload: argocd-cmp-cm
      volumes:
        - name: cmp-tmp
          emptyDir: {}
        - name: cmp-helmfile
          configMap:
            name: argocd-cmp-cm
      extraContainers:
        - name: helmfile-plugin
          image: {{ (getResource "ClusterConfig").data.argocdCmpImage }}
          command: [/var/run/argocd/argocd-cmp-server]
          securityContext:
            runAsNonRoot: true
            runAsUser: 999
          env:
            - name: HELMFILE_DISABLE_INSECURE_FEATURES
              value: "true"
            - name: HELMFILE_SKIP_INSECURE_TEMPLATE_FUNCTIONS
              value: "true"
            # Rendered helmfiles declare their own release namespaces; the Application's destination must not override them.
            # Read by travisghansen's plugin only; with camptocamp, configs.cmp above does this.
            - name: HELMFILE_USE_CONTEXT_NAMESPACE
              value: "true"
          volumeMounts:
            - mountPath: /var/run/argocd
              name: var-files
            - mountPath: /home/argocd/cmp-server/plugins
              name: plugins
            - mountPath: /tmp
              name: cmp-tmp
            - mountPath: /home/argocd/cmp-server/config/plugin.yaml
              name: cmp-helmfile
              subPath: helmfile.yaml
  argocd-mesh: |
    resources:
      # Selectorless stub of the hub's Cluster Mesh global argocd-server: no local
      # endpoints, Cilium resolves it to the management cluster's pods over the mesh.
      # Ports mirror the hub's Service (all targeting argocd-server's plaintext 8080).
      - apiVersion: v1
        kind: Service
        metadata:
          name: argocd-server
          namespace: {{ (getResource "BootstrapSettings").data.argocdNamespace | quote }}
          annotations:
            service.cilium.io/global: "true"
            # Never advertise: this cluster contributes no endpoints of its own.
            service.cilium.io/shared: "false"
        spec:
          type: ClusterIP
          ports:
            - name: http
              port: 80
              targetPort: 8080
              protocol: TCP
            - name: https
              port: 443
              targetPort: 8080
              protocol: TCP
            - name: http2
              port: 8080
              targetPort: 8080
              protocol: TCP
  mimir-gateway: |
    resources:
      # ClusterMesh global Service shim: no selector, no local endpoints. Cilium adds the
      # management cluster's, so writes go to central Mimir over the OVN peer.
      - apiVersion: v1
        kind: Service
        metadata:
          name: {{ (getResource "ClusterConfig").data.mimirGatewayService | quote }}
          namespace: {{ (getResource "ClusterConfig").data.mimirNamespace | quote }}
          annotations:
            service.cilium.io/global: "true"
            service.cilium.io/shared: "false"
        spec:
          ports:
            - name: http-metrics
              port: {{ (getResource "ClusterConfig").data.mimirGatewayPort }}
              targetPort: {{ (getResource "ClusterConfig").data.mimirGatewayPort }}
              protocol: TCP
  s3-endpoint: |
    resources:
      - apiVersion: v1
        kind: Service
        metadata:
          name: {{ (getResource "BootstrapSettings").data.s3ServiceName | quote }}
          namespace: {{ (getResource "BootstrapSettings").data.cephNamespace | quote }}
        spec:
          ports:
            - name: http
              port: {{ (getResource "ClusterConfig").data.s3Port }}
              targetPort: {{ (getResource "ClusterConfig").data.s3Port }}
              protocol: TCP
      - apiVersion: discovery.k8s.io/v1
        kind: EndpointSlice
        metadata:
          name: {{ (getResource "BootstrapSettings").data.s3ServiceName | quote }}
          namespace: {{ (getResource "BootstrapSettings").data.cephNamespace | quote }}
          labels:
            kubernetes.io/service-name: {{ (getResource "BootstrapSettings").data.s3ServiceName | quote }}
        addressType: IPv4
        ports:
          - name: http
            port: {{ (getResource "ClusterConfig").data.s3Port }}
            protocol: TCP
        endpoints:
          {{- range $host := splitList "," (getResource "ClusterConfig").data.s3Hosts }}
          - addresses:
              - {{ $host | trim | quote }}
          {{- end }}
  onepassword-connect: |
    connect:
      applicationName: onepassword-connect
      replicas: 1
      api:
        httpPort: 8080
      credentialsName: {{ (getResource "BootstrapSettings").data.connectCredentialsSecretName | quote }}
      # Secret data is already base64, which is what the chart expects here.
      credentials_base64: {{ index (getResource "BootstrapCredentials").data "op-connect-credentials" | quote }}
      serviceAnnotations:
        # Global Service: every cluster advertises its replica, so ESO keeps working
        # when the local one is down and reaches a peer's over the OVN mesh.
        service.cilium.io/global: "true"
  hubble-relay: |
    resources:
      # Cluster Mesh global Service: each cluster advertises its own relay under a name of
      # its own (one shared name would merge every cluster's relays). The central Hubble UI
      # on the management cluster dials a selectorless shim of the same name (GitOps
      # system/hubble-proxy), so no node IPs or NodePorts are involved.
      - apiVersion: v1
        kind: Service
        metadata:
          name: {{ printf "hubble-relay-%s" (getResource "ClusterConfig").data.clusterName | quote }}
          namespace: {{ (getResource "BootstrapSettings").data.kubeSystemNamespace | quote }}
          annotations:
            service.cilium.io/global: "true"
        spec:
          selector:
            k8s-app: hubble-relay
          ports:
            - name: grpc
              port: 80
              targetPort: grpc
              protocol: TCP
  cilium-mesh-certificates: |
    {{- $config := (getResource "ClusterConfig").data -}}
    {{- $settings := (getResource "BootstrapSettings").data -}}
    {{- if empty $config.clusterName -}}
    {{- fail "Cluster Mesh requires clusterName" -}}
    {{- end -}}
    resources:
      - apiVersion: external-secrets.io/v1
        kind: ExternalSecret
        metadata:
          name: {{ $settings.clusterMeshCaSecretName | quote }}
          namespace: {{ $settings.certificateNamespace | quote }}
        spec:
          refreshInterval: 1h
          secretStoreRef:
            kind: ClusterSecretStore
            name: {{ $settings.secretStoreName | quote }}
          target:
            name: {{ $settings.clusterMeshCaSecretName | quote }}
            creationPolicy: Owner
            template:
              type: kubernetes.io/tls
          data:
            - secretKey: tls.crt
              remoteRef:
                key: {{ $settings.clusterMeshCaItem | quote }}
                property: {{ $settings.clusterMeshCaCertificateField | quote }}
            - secretKey: tls.key
              remoteRef:
                key: {{ $settings.clusterMeshCaItem | quote }}
                property: {{ $settings.clusterMeshCaPrivateKeyField | quote }}
      - apiVersion: cert-manager.io/v1
        kind: ClusterIssuer
        metadata:
          name: {{ $settings.clusterMeshIssuerName | quote }}
        spec:
          ca:
            secretName: {{ $settings.clusterMeshCaSecretName | quote }}
      {{- range $role := list "server" "admin" "remote" "local" }}
      - apiVersion: cert-manager.io/v1
        kind: Certificate
        metadata:
          name: clustermesh-apiserver-{{ $role }}-cert
          namespace: {{ $settings.kubeSystemNamespace | quote }}
          labels:
            bootstrap.projectsveltos.io/cilium-certificate: "true"
        spec:
          secretName: clustermesh-apiserver-{{ $role }}-cert
          issuerRef:
            group: cert-manager.io
            kind: ClusterIssuer
            name: {{ $settings.clusterMeshIssuerName | quote }}
          {{- if eq $role "server" }}
          commonName: {{ printf "clustermesh-apiserver.%s.svc" $settings.kubeSystemNamespace | quote }}
          dnsNames:
            - {{ printf "clustermesh-apiserver.%s.svc" $settings.kubeSystemNamespace | quote }}
            - "*.mesh.cilium.io"
          ipAddresses: {{ $settings.clusterMeshApiserverIpAddresses }}
          usages:
            - digital signature
            - server auth
          {{- else }}
          commonName: {{ printf "%s-%s" $role $config.clusterName | quote }}
          usages:
            - digital signature
            - client auth
          {{- end }}
          duration: {{ $settings.clusterMeshCertificateDuration | quote }}
          renewBefore: {{ $settings.clusterMeshCertificateRenewBefore | quote }}
          privateKey:
            algorithm: ECDSA
            size: 256
            rotationPolicy: Always
      {{- end }}
      {{- $hubblePrefix := default $settings.hubbleTlsSecretPrefix (get $config "hubbleTlsSecretPrefix") }}
      {{- range $role := list "server" "relay-client" }}
      {{- $cn := "*.hubble-relay.cilium.io" }}
      {{- if eq $role "server" }}
      {{- $cn = printf "*.%s.hubble-grpc.cilium.io" (replace "." "-" $config.clusterName) }}
      {{- end }}
      - apiVersion: cert-manager.io/v1
        kind: Certificate
        metadata:
          name: {{ printf "%s-%s-certs" $hubblePrefix $role | quote }}
          namespace: {{ $settings.kubeSystemNamespace | quote }}
          labels:
            bootstrap.projectsveltos.io/cilium-certificate: "true"
        spec:
          secretName: {{ printf "%s-%s-certs" $hubblePrefix $role | quote }}
          issuerRef:
            group: cert-manager.io
            kind: ClusterIssuer
            name: {{ $settings.clusterMeshIssuerName | quote }}
          commonName: {{ $cn | quote }}
          dnsNames:
            - {{ $cn | quote }}
          usages:
            - digital signature
            - client auth
            {{- if eq $role "server" }}
            - server auth
            {{- end }}
          duration: {{ $settings.clusterMeshCertificateDuration | quote }}
          renewBefore: {{ $settings.clusterMeshCertificateRenewBefore | quote }}
          privateKey:
            algorithm: ECDSA
            size: 256
            rotationPolicy: Always
      {{- end }}
  ceph-csi-cephfs: |
    # Both Ceph CSI charts default to the same ConfigMap names; distinct names let them share a namespace.
    configMapName: ceph-csi-cephfs-config
    cephConfConfigMapName: ceph-cephfs-config
    kmsConfigMapName: ceph-csi-cephfs-encryption-kms-config
    csiConfig:
      - clusterID: {{ (getResource "ClusterConfig").data.cephClusterID | quote }}
        monitors: {{ splitList "," (getResource "ClusterConfig").data.cephMonitors | toJson }}
        cephFS:
          subvolumeGroup: csi
    provisioner:
      replicaCount: 2
      httpMetrics:
        enabled: true
        service:
          enabled: true
          annotations: &ceph-cephfs-metrics
            prometheus.io/scrape: "true"
            prometheus.io/path: /metrics
      {{- range $sidecar, $port := dict "provisioner" 8090 "resizer" 8091 "snapshotter" 8092 "attacher" 8093 }}
      {{ $sidecar }}:
        args:
          httpEndpointPort: {{ $port }}
      {{- end }}
    nodeplugin:
      httpMetrics:
        enabled: true
        service:
          enabled: true
          annotations: *ceph-cephfs-metrics
    secret:
      create: false
      name: csi-cephfs-secret
    storageClass:
      create: true
      name: cephfs-rwx
      annotations:
        storageclass.kubernetes.io/is-default-class: "false"
      clusterID: {{ (getResource "ClusterConfig").data.cephClusterID | quote }}
      fsName: k8s-cephfs
      # Talos kernels have CephFS built in, so the kernel client needs no extra image.
      mounter: kernel
      provisionerSecret: csi-cephfs-secret
      controllerExpandSecret: csi-cephfs-secret
      controllerPublishSecret: csi-cephfs-secret
      nodeStageSecret: csi-cephfs-secret
      # Delete removes the Ceph subvolume or RBD image with its PVC and PV.
      reclaimPolicy: Delete
      allowVolumeExpansion: true
    # Release name equals chart name, so the chart's computed names are these literals.
    extraDeploy:
      {{- range $sidecar, $port := dict "provisioner" 8090 "resizer" 8091 "snapshotter" 8092 "attacher" 8093 }}
      - apiVersion: v1
        kind: Service
        metadata:
          name: ceph-csi-cephfs-provisioner-{{ $sidecar }}-metrics
          annotations: *ceph-cephfs-metrics
          labels:
            csi_sidecar: {{ $sidecar | quote }}
        spec:
          ports:
            - name: {{ $sidecar | quote }}
              port: {{ $port }}
              targetPort: {{ $sidecar | quote }}
          selector:
            app: ceph-csi-cephfs
            component: provisioner
            release: ceph-csi-cephfs
      {{- end }}
      # Client key comes from 1Password through ESO; it never enters Helm values.
      - apiVersion: external-secrets.io/v1
        kind: ExternalSecret
        metadata:
          name: csi-cephfs-secret
          namespace: {{ (getResource "BootstrapSettings").data.cephNamespace | quote }}
        spec:
          refreshInterval: 1h
          secretStoreRef:
            kind: ClusterSecretStore
            name: {{ (getResource "BootstrapSettings").data.secretStoreName | quote }}
          target:
            name: csi-cephfs-secret
            creationPolicy: Owner
          data:
            - secretKey: userID
              remoteRef:
                key: ceph-csi-cephfs
                property: username
            - secretKey: userKey
              remoteRef:
                key: ceph-csi-cephfs
                property: password
  ceph-csi-rbd: |
    # Both Ceph CSI charts default to the same ConfigMap names; distinct names let them share a namespace.
    configMapName: ceph-csi-rbd-config
    cephConfConfigMapName: ceph-rbd-config
    kmsConfigMapName: ceph-csi-rbd-encryption-kms-config
    csiConfig:
      - clusterID: {{ (getResource "ClusterConfig").data.cephClusterID | quote }}
        monitors: {{ splitList "," (getResource "ClusterConfig").data.cephMonitors | toJson }}
    provisioner:
      replicaCount: 2
      httpMetrics:
        enabled: true
        service:
          enabled: true
          annotations: &ceph-rbd-metrics
            prometheus.io/scrape: "true"
            prometheus.io/path: /metrics
      {{- range $sidecar, $port := dict "provisioner" 8090 "resizer" 8091 "snapshotter" 8092 "attacher" 8093 }}
      {{ $sidecar }}:
        args:
          httpEndpointPort: {{ $port }}
      {{- end }}
    nodeplugin:
      httpMetrics:
        enabled: true
        service:
          enabled: true
          annotations: *ceph-rbd-metrics
    secret:
      create: false
      name: csi-rbd-secret
    storageClass:
      create: true
      name: ceph-rbd
      annotations:
        storageclass.kubernetes.io/is-default-class: "true"
      clusterID: {{ (getResource "ClusterConfig").data.cephClusterID | quote }}
      pool: k8s-rbd
      # layering is the feature set the Talos kernel RBD client maps without fallback.
      imageFeatures: layering
      fstype: ext4
      provisionerSecret: csi-rbd-secret
      controllerExpandSecret: csi-rbd-secret
      controllerPublishSecret: csi-rbd-secret
      nodeStageSecret: csi-rbd-secret
      # Delete removes the Ceph subvolume or RBD image with its PVC and PV.
      reclaimPolicy: Delete
      allowVolumeExpansion: true
    # Release name equals chart name, so the chart's computed names are these literals.
    extraDeploy:
      {{- range $sidecar, $port := dict "provisioner" 8090 "resizer" 8091 "snapshotter" 8092 "attacher" 8093 }}
      - apiVersion: v1
        kind: Service
        metadata:
          name: ceph-csi-rbd-provisioner-{{ $sidecar }}-metrics
          annotations: *ceph-rbd-metrics
          labels:
            csi_sidecar: {{ $sidecar | quote }}
        spec:
          ports:
            - name: {{ $sidecar | quote }}
              port: {{ $port }}
              targetPort: {{ $sidecar | quote }}
          selector:
            app: ceph-csi-rbd
            component: provisioner
            release: ceph-csi-rbd
      {{- end }}
      # Client key comes from 1Password through ESO; it never enters Helm values.
      - apiVersion: external-secrets.io/v1
        kind: ExternalSecret
        metadata:
          name: csi-rbd-secret
          namespace: {{ (getResource "BootstrapSettings").data.cephNamespace | quote }}
        spec:
          refreshInterval: 1h
          secretStoreRef:
            kind: ClusterSecretStore
            name: {{ (getResource "BootstrapSettings").data.secretStoreName | quote }}
          target:
            name: csi-rbd-secret
            creationPolicy: Owner
          data:
            - secretKey: userID
              remoteRef:
                key: ceph-csi-rbd
                property: username
            - secretKey: userKey
              remoteRef:
                key: ceph-csi-rbd
                property: password
  cert-manager: |
    cainjector:
      deploymentAnnotations:
        reloader.stakater.com/auto: "true"
    config:
      gatewayAPI:
        enabled: true
    crds:
      enabled: true
    deploymentAnnotations:
      reloader.stakater.com/auto: "true"
      secret.reloader.stakater.com/reload: {{ (getResource "BootstrapSettings").data.certificateCloudflareSecretName | quote }}
    webhook:
      deploymentAnnotations:
        reloader.stakater.com/auto: "true"
  external-dns-token-secret: |
    resources:
      - apiVersion: external-secrets.io/v1
        kind: ExternalSecret
        metadata:
          name: {{ (getResource "BootstrapSettings").data.dnsCloudflareSecretName | quote }}
        spec:
          data:
            - remoteRef:
                key: {{ (getResource "BootstrapSettings").data.cloudflareSecretItem | quote }}
                property: {{ (getResource "BootstrapSettings").data.cloudflareSecretField | quote }}
              secretKey: {{ (getResource "BootstrapSettings").data.cloudflareSecretKey | quote }}
          refreshInterval: 1h
          secretStoreRef:
            kind: ClusterSecretStore
            name: {{ (getResource "BootstrapSettings").data.secretStoreName | quote }}
          target:
            creationPolicy: Owner
            name: {{ (getResource "BootstrapSettings").data.dnsCloudflareSecretName | quote }}
  external-dns: |
    deploymentAnnotations:
      reloader.stakater.com/auto: "true"
    enableGatewayListenerSets: true
    env:
      - name: CF_API_TOKEN
        valueFrom:
          secretKeyRef:
            key: {{ (getResource "BootstrapSettings").data.cloudflareSecretKey | quote }}
            name: {{ (getResource "BootstrapSettings").data.dnsCloudflareSecretName | quote }}
    extraArgs:
      - --annotation-filter=external-dns.kubernetes.io/enabled=true
    policy: sync
    provider:
      name: cloudflare
    service:
      annotations:
        prometheus.io/path: /metrics
        prometheus.io/scrape: "true"
    sources:
      - service
      - ingress
      - gateway-httproute
    txtOwnerId: {{ default (printf "%s-%s" .Cluster.metadata.namespace .Cluster.metadata.name) (index ((index .Cluster.metadata "annotations") | default dict) "bootstrap.projectsveltos.io/dns-owner") | quote }}
  external-secrets-operator: |
    {{- $virtual := eq (index .Cluster.metadata.labels "bootstrap.projectsveltos.io/virtual" | default "") "true" }}
    {{- if $virtual }}
    # vClusters skip the admission webhook and its cert controller; ESO reconciles without them.
    webhook:
      create: false
    certController:
      create: false
    resources:
      requests:
        cpu: 10m
        memory: 48Mi
    {{- else }}
    certController:
      podAnnotations:
        prometheus.io/path: /metrics
        prometheus.io/port: "8080"
        prometheus.io/scrape: "true"
    podAnnotations:
      prometheus.io/path: /metrics
      prometheus.io/port: "8080"
      prometheus.io/scrape: "true"
    webhook:
      podAnnotations:
        prometheus.io/path: /metrics
        prometheus.io/port: "8080"
        prometheus.io/scrape: "true"
    {{- end }}
  cluster-secret-store: |
    resources:
      - apiVersion: v1
