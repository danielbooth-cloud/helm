      - apiVersion: gateway.networking.k8s.io/v1
        kind: GatewayClass
        metadata:
          name: cilium-tailscale
        spec:
          controllerName: io.cilium/gateway-controller
          parametersRef:
            group: cilium.io
            kind: CiliumGatewayClassConfig
            name: tailscale
            namespace: {{ (getResource "BootstrapSettings").data.gatewayNamespace | quote }}
      - apiVersion: gateway.networking.k8s.io/v1
        kind: Gateway
        metadata:
          name: {{ (getResource "BootstrapSettings").data.gatewayName | quote }}
          namespace: {{ (getResource "BootstrapSettings").data.gatewayNamespace | quote }}
          annotations:
            cert-manager.io/cluster-issuer: {{ (getResource "BootstrapSettings").data.issuerName | quote }}
        spec:
          gatewayClassName: cilium-tailscale
          infrastructure:
            annotations:
              tailscale.com/hostname: {{ printf "%s-gateway" (getResource "ClusterConfig").data.clusterName | quote }}
          allowedListeners:
            namespaces:
              from: Selector
              selector:
                matchLabels:
                  gateway-access: "true"
          listeners:
            # Keep this placeholder inert; application routes attach through ListenerSets.
            - name: default
              port: 80
              protocol: HTTP
              allowedRoutes:
                namespaces:
                  from: Selector
                  selector:
                    matchExpressions:
                      - key: kubernetes.io/metadata.name
                        operator: DoesNotExist
  kro: |
    deployment:
      podAnnotations:
        prometheus.io/path: /metrics
        prometheus.io/port: "8078"
        prometheus.io/scrape: "true"
  cluster-api-operator: |
    # Providers come from the cluster-api-providers release; hook-created ones are recreated on every upgrade.
    enableHelmHook: false
    # The chart tolerates control planes; keep the operator on workers.
    affinity:
      nodeAffinity:
        requiredDuringSchedulingIgnoredDuringExecution:
          nodeSelectorTerms:
            - matchExpressions:
                - key: node-role.kubernetes.io/control-plane
                  operator: DoesNotExist
                - key: kubernetes.io/os
